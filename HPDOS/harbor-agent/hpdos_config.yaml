# Example Harbor job configuration for HPDOS agent
# Save as: hpdos_config.yaml
# Usage: harbor run --config hpdos_config.yaml

job_name: hpdos-benchmark

# Agent configuration
agent:
  import_path: hpdos_harbor.agent:HPDOSAgent
  model_name: anthropic/claude-sonnet-4-6

# Environment configuration
environment:
  type: docker
  image: hpdos-terminal-bench:latest
  timeout_sec: 1800  # 30 minutes

# Dataset configuration
dataset:
  name: terminal-bench
  version: "2.0"

# Run configuration
n_trials: 1
n_attempts: 1
timeout_multiplier: 1.0

# Logging
log_level: INFO
verbose: false
