<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPD-OS Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --color-hpd-ink: oklch(0.18 0.03 260);
      --color-hpd-muted: oklch(0.53 0.035 260);
      --color-hpd-line: oklch(0.86 0.018 260);
      --color-hpd-soft: oklch(0.97 0.01 260);
      --color-hpd-panel: oklch(1 0 0);
      --color-hpd-blue: oklch(0.55 0.22 260);
      --color-hpd-green: oklch(0.58 0.14 155);
      --color-hpd-amber: oklch(0.64 0.16 70);
      --color-hpd-red: oklch(0.56 0.2 25);
      --radius-hpd: 0.5rem;
      --shadow-hpd: 0 14px 36px rgb(15 23 42 / 0.10);
    }

    @custom-variant selected (&[aria-current="page"]);

    @utility hpd-panel {
      border: 1px solid var(--color-hpd-line);
      background: color-mix(in oklab, var(--color-hpd-panel) 94%, transparent);
      backdrop-filter: blur(18px);
    }

    @utility hpd-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.25rem;
      border-radius: var(--radius-hpd);
      padding-inline: 0.75rem;
      font-size: 0.8125rem;
      font-weight: 800;
      transition: color 150ms, background-color 150ms, border-color 150ms, box-shadow 150ms, opacity 150ms;
    }

    @utility hpd-input {
      min-height: 2.25rem;
      width: 100%;
      border-radius: var(--radius-hpd);
      border: 1px solid var(--color-hpd-line);
      background: white;
      padding-inline: 0.75rem;
      font-size: 0.8125rem;
      outline: none;
    }

    @utility hpd-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--color-hpd-line);
      background: var(--color-hpd-soft);
      padding: 0.125rem 0.5rem;
      font-size: 0.6875rem;
      font-weight: 800;
      white-space: nowrap;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 0%, rgb(37 99 235 / 0.08), transparent 30rem),
        linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%);
      color: var(--color-hpd-ink);
      font-family: var(--font-sans);
      letter-spacing: 0;
    }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    textarea { resize: none; }
    .htmx-request [data-loading-label] { opacity: 0.55; }
    .message-markdown pre, .json-box {
      overflow: auto;
      border-radius: var(--radius-hpd);
      background: #111827;
      color: #e5edf8;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message-markdown code {
      border-radius: 0.25rem;
      background: #eef2f7;
      color: #175cd3;
      padding: 0.0625rem 0.3125rem;
      font-size: 0.9em;
    }
    .message-markdown pre code { background: transparent; color: inherit; padding: 0; }
    .artifact-card {
      border: 1px solid var(--color-hpd-line);
      border-radius: var(--radius-hpd);
      background: white;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.08);
      overflow: hidden;
    }
    .artifact-card[data-open="true"] {
      border-color: color-mix(in oklab, var(--color-hpd-blue) 45%, white);
      box-shadow: 0 10px 28px rgb(37 99 235 / 0.12);
    }
    .artifact-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid var(--color-hpd-line);
      background: color-mix(in oklab, var(--color-hpd-soft) 72%, white);
      padding: 0.75rem 0.875rem;
    }
    .artifact-card-body {
      max-height: min(62vh, 680px);
      overflow: auto;
      padding: 0.875rem;
    }
    .artifact-tab {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.25rem 0.625rem;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--color-hpd-muted);
    }
    .artifact-tab[aria-current="true"] {
      border-color: var(--color-hpd-line);
      background: white;
      color: var(--color-hpd-ink);
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.08);
    }
    .artifact-render {
      overflow-wrap: anywhere;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .artifact-render pre {
      overflow: auto;
      border-radius: var(--radius-hpd);
      background: #111827;
      color: #e5edf8;
      padding: 0.875rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .artifact-frame {
      min-height: 420px;
      width: 100%;
      border: 1px solid var(--color-hpd-line);
      border-radius: var(--radius-hpd);
      background: white;
    }
    .graph-grid {
      background:
        linear-gradient(#e7edf5 1px, transparent 1px),
        linear-gradient(90deg, #e7edf5 1px, transparent 1px),
        white;
      background-size: 32px 32px;
    }
  </style>
</head>
<body>
  <main class="grid h-dvh min-h-0">
    <div class="min-h-0 min-w-0 overflow-hidden p-3" id="view" hx-get="/ui/chat" hx-trigger="load" hx-swap="innerHTML"></div>
  </main>

  <div class="fixed inset-x-4 bottom-4 z-50 mx-auto hidden max-w-2xl rounded-hpd border border-hpd-line bg-white p-3 text-sm font-semibold shadow-hpd" id="toast"></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
