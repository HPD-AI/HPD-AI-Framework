<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPD-OS Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <style type="text/tailwindcss">
    @theme {
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --color-hpd-ink: oklch(0.18 0.03 260);
      --color-hpd-muted: oklch(0.53 0.035 260);
      --color-hpd-line: oklch(0.86 0.018 260);
      --color-hpd-soft: oklch(0.97 0.01 260);
      --color-hpd-panel: oklch(1 0 0);
      --color-hpd-blue: oklch(0.55 0.22 260);
      --color-hpd-green: oklch(0.58 0.14 155);
      --color-hpd-amber: oklch(0.64 0.16 70);
      --color-hpd-red: oklch(0.56 0.2 25);
      --radius-hpd: 0.5rem;
      --shadow-hpd: 0 14px 36px rgb(15 23 42 / 0.10);
    }

    @custom-variant selected (&[aria-current="page"]);

    @utility hpd-panel {
      @apply border border-hpd-line;
      background: color-mix(in oklab, var(--color-hpd-panel) 94%, transparent);
      backdrop-filter: blur(18px);
    } 

    @utility hpd-button {
      @apply inline-flex min-h-9 items-center justify-center gap-2 rounded-hpd px-3 text-[0.8125rem] font-extrabold;
      transition: color 150ms, background-color 150ms, border-color 150ms, box-shadow 150ms, opacity 150ms;
    }

    @utility hpd-input {
      @apply min-h-9 w-full rounded-hpd border border-hpd-line bg-white px-3 text-[0.8125rem] outline-none;
    }

    @utility hpd-badge {
      @apply inline-flex items-center rounded-full border border-hpd-line bg-hpd-soft px-2 py-0.5 text-[0.6875rem] font-extrabold whitespace-nowrap;
    }

    @utility hpd-sidebar-section {
      @apply grid gap-2 border-b border-hpd-line p-3;
    }

    @utility hpd-section-label {
      @apply text-[0.6875rem] font-black uppercase text-hpd-muted;
      letter-spacing: 0.04em;
    }

    @utility hpd-path {
      @apply truncate font-mono text-[0.6875rem] font-bold text-hpd-muted;
    }

    @utility hpd-empty {
      @apply rounded-hpd border border-dashed border-hpd-line p-3 text-[0.8125rem] font-bold text-hpd-muted;
      background: color-mix(in oklab, white 70%, transparent);
    }

    .hpd-title {
      @apply truncate text-base font-black;
    }
    .hpd-title-sm {
      @apply truncate text-sm font-black;
    }
    .hpd-meta {
      @apply truncate text-xs font-bold text-hpd-muted;
    }
    .hpd-inline {
      @apply flex items-center gap-2;
    }
    .hpd-cluster {
      @apply flex shrink-0 items-center gap-2;
    }
    .hpd-tab-group {
      @apply flex rounded-full border border-hpd-line bg-hpd-soft p-0.5;
    }

    .hpd-app {
      @apply grid h-dvh min-h-dvh;
    }
    .hpd-view {
      @apply min-h-0 min-w-0 overflow-hidden p-3;
    }
    .hpd-shell {
      @apply grid h-full min-h-0 gap-3;
      grid-template-columns: minmax(320px, 360px) minmax(0, 1fr);
    }
    .hpd-toast {
      @apply fixed bottom-4 z-50 mx-auto max-w-2xl rounded-hpd border border-hpd-line bg-white p-3 text-sm font-bold shadow-hpd;
      inset-inline: 1rem;

      &[data-visible="false"] { display: none; }
    }

    .hpd-sidebar {
      @apply flex min-h-0 flex-col rounded-hpd;
    }
    .hpd-sidebar-header {
      @apply border-b border-hpd-line p-3;
      background: color-mix(in oklab, white 80%, transparent);
    }
    .hpd-sidebar-title {
      @apply grid gap-1;
    }
    .hpd-sidebar-actions {
      @apply grid gap-2 border-b border-hpd-line p-3;
    }
    .hpd-button-primary {
      background: var(--color-hpd-blue);
      color: white;
    }
    .hpd-button-secondary {
      @apply border border-hpd-line bg-white text-hpd-muted;
    }
    .hpd-button-dark {
      background: var(--color-hpd-ink);
      color: white;
    }
    .hpd-icon-button {
      @apply min-h-9 w-9 shrink-0 border border-hpd-line bg-white px-0 text-hpd-muted;
    }

    .hpd-session-scroll {
      @apply min-h-0 flex-1 overflow-auto p-2;
    }
    .hpd-session-list {
      @apply grid gap-1;
    }
    .hpd-session {
      @apply grid w-full rounded-hpd border border-transparent px-3 py-2.5 text-left;
      transition: color 150ms, background-color 150ms, border-color 150ms, box-shadow 150ms;

      &:hover {
        @apply border-hpd-line bg-white;
      }

      &[aria-current="page"] {
        border-color: color-mix(in oklab, var(--color-hpd-blue) 25%, white);
        background: color-mix(in oklab, var(--color-hpd-blue) 8%, white);
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
      }
    }

    .hpd-workspace-card {
      @apply grid min-w-0 max-w-full gap-2 rounded-hpd border border-hpd-line bg-white p-3;
    }
    .hpd-workspace-roots, .hpd-workspace-input {
      @apply grid min-w-0 max-w-full gap-2;
    }
    .hpd-workspace-root {
      @apply grid min-w-0 max-w-full items-center gap-2 rounded-md border border-hpd-line bg-hpd-soft p-2;
      grid-template-columns: minmax(0, 1fr) 2.25rem;
    }
    .hpd-workspace-actions {
      @apply grid min-w-0 max-w-full grid-cols-2 gap-2;
    }

    .hpd-chat-panel {
      @apply grid min-h-0 overflow-hidden rounded-hpd;
      container: hpd-chat / inline-size;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    .hpd-chat-header {
      @apply flex items-center justify-between gap-3 border-b border-hpd-line p-3;
      background: color-mix(in oklab, white 85%, transparent);
    }
    .hpd-chat-scroll {
      @apply min-h-0 overflow-auto p-4;
      background: color-mix(in oklab, var(--color-hpd-soft) 70%, transparent);
      scrollbar-width: thin;
      scrollbar-color: color-mix(in oklab, var(--color-hpd-muted) 38%, transparent) transparent;
    }
    .hpd-chat-stack {
      @apply mx-auto grid max-w-4xl gap-4;
    }

    .hpd-row {
      @apply flex justify-start;
      animation: hpd-item-in 180ms ease-out both;

      &[data-role="user"] { justify-content: flex-end; }
      &[data-kind="artifact"] { justify-content: center; }
    }

    .hpd-message, .hpd-error-message {
      @apply max-w-[82%] rounded-2xl px-4 py-3 text-sm leading-6 shadow-sm;
      border-top-left-radius: 0.375rem;
    }

    .hpd-message {
      &[data-role="assistant"] {
        @apply border border-hpd-line bg-white;
      }

      &[data-role="user"] {
        @apply max-w-[78%] bg-hpd-blue text-white;
        border-top-left-radius: 1rem;
        border-top-right-radius: 0.375rem;
      }
    }

    .hpd-error-message {
      @apply border;
      border-color: color-mix(in oklab, var(--color-hpd-red) 25%, white);
      background: color-mix(in oklab, var(--color-hpd-red) 8%, white);
      color: color-mix(in oklab, var(--color-hpd-red) 70%, black);
    }
    .hpd-reasoning, .hpd-tool {
      @apply rounded-hpd border border-hpd-line bg-white shadow-sm;
      animation: hpd-item-in 180ms ease-out both;
    }

    .hpd-reasoning {
      background: color-mix(in oklab, white 80%, transparent);

      .hpd-disclosure-summary {
        color: var(--color-hpd-muted);
      }
    }

    .hpd-disclosure-summary {
      @apply cursor-pointer px-4 py-3 text-sm font-black;
    }

    .hpd-tool {
      &[data-status="streaming"] {
        border-color: color-mix(in oklab, var(--color-hpd-amber) 35%, white);
        background: color-mix(in oklab, var(--color-hpd-amber) 5%, white);
        box-shadow: 0 0 0 3px color-mix(in oklab, var(--color-hpd-amber) 12%, transparent);
      }

      &[data-status="complete"] {
        border-color: color-mix(in oklab, var(--color-hpd-green) 25%, var(--color-hpd-line));
      }
    }

    .hpd-tool-body {
      @apply grid gap-2 border-t border-hpd-line p-3;
    }

    .hpd-composer {
      @apply border-t border-hpd-line bg-white p-3;
    }
    .hpd-composer-box {
      @apply rounded-hpd border border-hpd-line bg-white p-2 shadow-sm;
    }
    .hpd-composer-input {
      @apply min-h-14 max-h-48 w-full bg-transparent px-3 py-2 text-sm leading-6 outline-none;
      field-sizing: content;
    }
    .hpd-composer-input::placeholder { color: #94a3b8; }
    .hpd-composer-footer {
      @apply flex items-center justify-between gap-2 border-t border-hpd-line pt-2;
    }
    .hpd-runtime-trigger {
      @apply cursor-pointer px-2 py-1 text-xs font-black text-hpd-muted;
    }
    .hpd-runtime-popover {
      @apply mt-2 grid gap-2 rounded-hpd border border-hpd-line bg-hpd-soft p-2.5;
      width: min(24rem, calc(100vw - 2rem));
      height: fit-content;
      margin: 0;
      grid-template-columns: minmax(0, 1fr);

      &:not(:popover-open) {
        display: none;
      }

      &:popover-open {
        display: grid;
        inset: auto;
        max-block-size: min(12rem, calc(100vh - 2rem));
        overflow: auto;
        position-area: block-start span-inline-end;
        position-try-order: most-block-size;
        position-try-fallbacks:
          block-start span-inline-start,
          block-end span-inline-end,
          block-end span-inline-start;
        @apply shadow-hpd;
      }

      .hpd-input {
        @apply min-h-8 px-2.5 text-xs;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 0%, rgb(37 99 235 / 0.08), transparent 30rem),
        linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%);
      color: var(--color-hpd-ink);
      font-family: var(--font-sans);
      letter-spacing: 0;
    }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    textarea { resize: none; }
    .message-markdown pre, .hpd-code-box {
      @apply overflow-auto rounded-hpd p-3 font-mono text-xs;
      font-family: var(--font-mono);
      background: #111827;
      color: #e5edf8;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in oklab, white 28%, transparent) transparent;
    }

    .message-markdown {
      code {
        border-radius: 0.25rem;
        background: #eef2f7;
        color: #175cd3;
        padding: 0.0625rem 0.3125rem;
        font-size: 0.9em;
      }

      pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }
    }

    .hpd-artifact {
      @apply w-full max-w-4xl overflow-hidden rounded-hpd border border-hpd-line bg-white shadow-sm;
      container: hpd-artifact / inline-size;

      &[data-open="true"] {
        border-color: color-mix(in oklab, var(--color-hpd-blue) 45%, white);
        box-shadow: 0 10px 28px rgb(37 99 235 / 0.12);
      }
    }

    .hpd-artifact-header {
      @apply flex items-center justify-between gap-3 border-b border-hpd-line px-3.5 py-3;
      background: color-mix(in oklab, var(--color-hpd-soft) 72%, white);
    }

    .hpd-artifact-body {
      @apply overflow-auto p-3.5;
      max-height: min(62vh, 680px);
      scrollbar-width: thin;
      scrollbar-color: color-mix(in oklab, var(--color-hpd-muted) 38%, transparent) transparent;
    }

    .hpd-artifact-tab {
      @apply rounded-full border border-transparent px-2.5 py-1 text-xs font-extrabold text-hpd-muted;

      &[aria-current="page"] {
        @apply border-hpd-line bg-white text-hpd-ink shadow-sm;
      }
    }

    .hpd-artifact-render {
      @apply text-sm;
      overflow-wrap: anywhere;
      line-height: 1.6;

      pre {
        @apply overflow-auto rounded-hpd p-3.5 font-mono text-xs;
        background: #111827;
        color: #e5edf8;
        line-height: 1.55;
        white-space: pre-wrap;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in oklab, white 28%, transparent) transparent;
      }
    }

    .hpd-artifact-frame {
      @apply min-h-[420px] w-full rounded-hpd border border-hpd-line bg-white;
    }

    @keyframes hpd-item-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @starting-style {
      :where(.hpd-row, .hpd-tool, .hpd-reasoning) {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    @container hpd-chat (max-width: 680px) {
      .hpd-chat-scroll { padding: 0.75rem; }
      .hpd-chat-stack { gap: 0.75rem; }
      :where(.hpd-message, .hpd-error-message) { max-width: 92%; }
      .hpd-message[data-role="user"] { max-width: 88%; }
      .hpd-disclosure-summary { padding: 0.625rem 0.75rem; }
      .hpd-tool-body { padding: 0.625rem; }
    }

    @container hpd-artifact (max-width: 560px) {
      .hpd-artifact-header {
        align-items: stretch;
        flex-direction: column;
      }
      .hpd-cluster {
        justify-content: space-between;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :where(*, *::before, *::after) {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }

    @media (max-width: 768px) {
      .hpd-shell { grid-template-columns: 1fr; }
      .hpd-runtime-popover { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
