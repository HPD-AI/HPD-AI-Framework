<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPD-OS Starting</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    body {
      display: grid;
      place-items: center;
    }
    main {
      width: min(420px, calc(100vw - 32px));

      border-radius: 8px;
      background: white;
      padding: 24px;
      box-shadow: 0 14px 36px rgb(15 23 42 / 0.10);
    }
    h1 {
      margin: 0;
      font-size: 18px;
    }
    p {
      margin: 8px 0 0;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>HPD-OS backend is still starting</h1>
    <p>Check the terminal output for the .NET backend. The desktop shell opens the app when the local backend responds.</p>
  </main>
</body>
</html>
