      <rect x="16" y="88" width="150" height="18" rx="4" fill="#2d2944" />
      <text x="26" y="101" fill="#cfc6ff" font-size="9.5">Collapsed harness</text>
      <rect x="16" y="112" width="150" height="18" rx="4" fill="#243525" />
      <text x="26" y="125" fill="#a6d9a5" font-size="9.5">Scoped Middleware</text>
      <rect x="16" y="136" width="150" height="18" rx="4" fill="#3b2e28" />
      <text x="26" y="149" fill="#f0c89f" font-size="9.5">System Prompt</text>
      <rect x="16" y="156" width="98" height="2" rx="1" fill="#6d9fd2" />
