    <text x="95" y="31" fill="#243244" font-size="15" font-weight="650" text-anchor="middle">ASP.NET Hosting</text>
    <text x="95" y="52" fill="#627084" font-size="10.8" text-anchor="middle">embedded web API layer</text>
    <rect x="20" y="70" width="150" height="26" rx="5" fill="#f4f7fb" stroke="#d9e3ee" />
    <text x="95" y="87" fill="#39475a" font-size="11" text-anchor="middle">AddHPDAgent</text>
    <rect x="20" y="104" width="150" height="26" rx="5" fill="#f4f7fb" stroke="#d9e3ee" />
    <text x="95" y="121" fill="#39475a" font-size="11" text-anchor="middle">MapHPDAgentApi</text>
    <rect x="20" y="138" width="150" height="26" rx="5" fill="#eef6ff" stroke="#c7dcf3" />
    <text x="95" y="155" fill="#225b8f" font-size="11" text-anchor="middle">SSE + WebSocket</text>
