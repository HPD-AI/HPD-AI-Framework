    <text x="115" y="32" fill="#243244" font-size="15" font-weight="650" text-anchor="middle">Chat + Audio Providers</text>
    <text x="115" y="52" fill="#627084" font-size="10.8" text-anchor="middle">adapter-based inference and voice</text>
    <rect x="22" y="72" width="186" height="26" rx="5" fill="#fff7ed" stroke="#f0c89f" />
    <text x="115" y="89" fill="#8a4b16" font-size="11.5" text-anchor="middle">OpenAI · Azure · Anthropic</text>
    <rect x="22" y="106" width="186" height="26" rx="5" fill="#fff7ed" stroke="#f0c89f" />
    <text x="115" y="123" fill="#8a4b16" font-size="11.5" text-anchor="middle">Bedrock · Ollama · Local</text>
    <rect x="22" y="140" width="186" height="26" rx="5" fill="#eef9f7" stroke="#b8ddd7" />
    <text x="115" y="157" fill="#17665d" font-size="11.5" text-anchor="middle">OpenAI Audio · ElevenLabs</text>
    <rect x="22" y="174" width="186" height="22" rx="5" fill="#eef9f7" stroke="#b8ddd7" />
    <text x="115" y="189" fill="#17665d" font-size="10.5" text-anchor="middle">Silero · MEAI Speech</text>
  </g>

  <g transform="translate(595, 635)" class="cluster">
    <rect class="panel" width="230" height="250" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="115" y="32" fill="#243244" font-size="15" font-weight="650" text-anchor="middle">Tool Harness</text>
    <text x="115" y="52" fill="#627084" font-size="10.8" text-anchor="middle">execute work safely</text>
    <g transform="translate(24, 70)">
      <rect width="182" height="164" rx="7" fill="#17202a" stroke="#2f3e4d" stroke-width="1.5" />
      <text x="18" y="24" fill="#eef6ff" font-size="11">tool.run</text>
