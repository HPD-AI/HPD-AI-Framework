<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #ffffff;">
  <defs>
    <marker id="agent-v3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa6b2" />
    </marker>
    <style>
      .flow {
        stroke-dasharray: 7 7;
        animation: flow 1.45s linear infinite;
      }
      .flow-soft {
        stroke-dasharray: 4 6;
        animation: flowSoft 1.8s linear infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -14; }
      }
      @keyframes flowSoft {
        to { stroke-dashoffset: -20; }
      }
      .panel {
        transition: fill 0.2s ease, stroke 0.2s ease;
      }
      .cluster:hover .panel {
        fill: #fbfdff;
        stroke: #6d9fd2;
      }
      .runtime-ring {
        animation: runtimePulse 4.5s ease-in-out infinite;
      }
      @keyframes runtimePulse {
        0%, 100% { stroke: #c9d7e5; }
        50% { stroke: #6d9fd2; }
      }
      .status {
        animation: statusBlink 1.8s ease-in-out infinite;
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <g>
    <text x="50" y="60" fill="#243244" font-size="24" font-weight="650">HPD-Agent Architecture</text>
    <text x="50" y="90" fill="#627084" font-size="14">ASP.NET Hosting, Runtime Orchestration, Tools, Memory, Evaluation, and Event Streaming</text>
  </g>

  <g>
    <path d="M 286 265 L 350 265" class="flow" fill="none" stroke="#9aa6b2" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 350 305 L 286 305" class="flow" fill="none" stroke="#9aa6b2" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 540 310 L 602 310" class="flow" fill="none" stroke="#9aa6b2" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 602 350 L 540 350" class="flow" fill="none" stroke="#9aa6b2" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 655 505 L 655 635" class="flow-soft" fill="none" stroke="#6d9fd2" stroke-width="1.8" marker-end="url(#agent-v3-arrow)" />
    <path d="M 725 635 L 725 505" class="flow-soft" fill="none" stroke="#6d9fd2" stroke-width="1.8" marker-end="url(#agent-v3-arrow)" />
    <path d="M 790 365 L 900 365" class="flow" fill="none" stroke="#9aa6b2" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 790 420 L 900 520" class="flow-soft" fill="none" stroke="#6d9fd2" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 602 475 L 372 610" class="flow-soft" fill="none" stroke="#6d9fd2" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 372 650 L 602 500" class="flow-soft" fill="none" stroke="#6d9fd2" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 690 235 L 690 165" class="flow-soft" fill="none" stroke="#6d9fd2" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 256 678 L 392 766" class="flow-soft" fill="none" stroke="#6d9fd2" stroke-width="1.6" marker-end="url(#agent-v3-arrow)" />
  </g>

  <g transform="translate(70, 170)" class="cluster">
    <rect class="panel" width="216" height="250" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="108" y="32" fill="#243244" font-size="15" font-weight="650" text-anchor="middle">Client Surfaces</text>
    <text x="108" y="52" fill="#627084" font-size="11" text-anchor="middle">all user-facing adapters</text>
    <rect x="20" y="72" width="176" height="26" rx="5" fill="#eef6ff" stroke="#c7dcf3" />
    <text x="108" y="89" fill="#225b8f" font-size="11" text-anchor="middle">Web Client + Headless UI</text>
    <rect x="20" y="106" width="176" height="26" rx="5" fill="#eef6ff" stroke="#c7dcf3" />
    <text x="108" y="123" fill="#225b8f" font-size="11.5" text-anchor="middle">TUI + CLI</text>
    <rect x="20" y="140" width="176" height="26" rx="5" fill="#eef6ff" stroke="#c7dcf3" />
    <text x="108" y="157" fill="#225b8f" font-size="11.5" text-anchor="middle">Slack · Teams</text>
    <rect x="20" y="174" width="176" height="26" rx="5" fill="#eef6ff" stroke="#c7dcf3" />
    <text x="108" y="191" fill="#225b8f" font-size="11.5" text-anchor="middle">Discord · Telegram</text>
    <rect x="20" y="208" width="176" height="26" rx="5" fill="#eef6ff" stroke="#c7dcf3" />
    <text x="108" y="225" fill="#225b8f" font-size="11.5" text-anchor="middle">WhatsApp</text>
  </g>

