    <text x="94" y="34" fill="#243244" font-size="16" font-weight="700" text-anchor="middle">Agent Runtime</text>
    <text x="94" y="54" fill="#627084" font-size="11" text-anchor="middle">turn orchestration core</text>
    <rect x="20" y="76" width="148" height="27" rx="5" fill="#eef9f7" stroke="#b8ddd7" />
    <text x="94" y="94" fill="#17665d" font-size="11.5" text-anchor="middle">Middleware Pipeline</text>
