    <text x="94" y="130" fill="#17665d" font-size="11.5" text-anchor="middle">Model Loop</text>
    <rect x="20" y="148" width="148" height="27" rx="5" fill="#eef9f7" stroke="#b8ddd7" />
    <text x="94" y="166" fill="#17665d" font-size="11.5" text-anchor="middle">Tool Planning</text>
    <rect x="20" y="184" width="148" height="27" rx="5" fill="#eef9f7" stroke="#b8ddd7" />
    <text x="94" y="202" fill="#17665d" font-size="11.5" text-anchor="middle">Event Streaming</text>
