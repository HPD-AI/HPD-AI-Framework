    <rect x="22" y="72" width="188" height="26" rx="5" fill="#f4f7fb" stroke="#d9e3ee" />
    <text x="116" y="89" fill="#39475a" font-size="11.5" text-anchor="middle">sessions · threads · messages</text>
    <rect x="22" y="106" width="188" height="26" rx="5" fill="#f4f7fb" stroke="#d9e3ee" />
    <text x="116" y="123" fill="#39475a" font-size="11.5" text-anchor="middle">content · memory · artifacts</text>
  </g>

  <g transform="translate(900, 500)" class="cluster">
    <rect class="panel" width="230" height="155" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="115" y="32" fill="#243244" font-size="15" font-weight="650" text-anchor="middle">Evaluation</text>
