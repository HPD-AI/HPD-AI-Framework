<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, 'Apple Color Emoji', Arial, sans-serif, 'Segoe UI Emoji', 'Segoe UI Symbol'; background: #ffffff;">
  <defs>
    <marker id="arrow-minimal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1d5db" />
    </marker>
    <style>
      .animate-node {
        opacity: 0;
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .delay-1 { animation-delay: 0.1s; }
      .delay-2 { animation-delay: 0.25s; }
      .delay-3 { animation-delay: 0.4s; }
      .delay-4 { animation-delay: 0.55s; }
      .delay-5 { animation-delay: 0.7s; }
      .delay-6 { animation-delay: 0.85s; }
      .flow-line {
        stroke-dasharray: 6 6;
        opacity: 0;
        animation: flow 1.5s linear infinite, fadeIn 0.5s ease-out 0.8s forwards;
      }
      .flow-dash-4 {
        stroke-dasharray: 4 4;
        opacity: 0;
        animation: flow-4 1s linear infinite, fadeIn 0.5s ease-out 0.8s forwards;
      }
      .flow-state {
        stroke-dasharray: 3 5;
        opacity: 0;
        animation: flow-state 2s linear infinite, fadeIn 0.5s ease-out 0.8s forwards;
      }
      @keyframes flow {
        to { stroke-dashoffset: -12; }
      }
      @keyframes flow-4 {
        to { stroke-dashoffset: -8; }
      }
      @keyframes flow-state {
        to { stroke-dashoffset: -16; }
      }
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      .interactive-rect {
        transition: stroke 0.2s ease, fill 0.2s ease;
      }
      .node-group:hover .interactive-rect {
        stroke: #9ca3af;
        fill: #f9fafb;
        cursor: default;
      }
      .core-pulse {
        animation: pulseCore 4s ease-in-out infinite;
      }
      @keyframes pulseCore {
        0% { stroke: #d1d5db; }
        50% { stroke: #6b7280; }
        100% { stroke: #d1d5db; }
      }
    </style>
  </defs>

  <!-- Title -->
  <g class="animate-node" style="animation-delay: 0s;">
    <text x="50" y="60" fill="#37352f" font-size="24" font-weight="600" letter-spacing="-0.5">HPD-Graph Architecture</text>
    <text x="50" y="90" fill="#787774" font-size="14">Workflow Execution, Routing, and Durable Data Orchestration</text>
  </g>

  <g>
    <!-- ═══════════════════════════════════════════════ -->
    <!-- CONNECTIONS                                     -->
    <!-- ═══════════════════════════════════════════════ -->

    <!-- Graph Definition -> Core -->
    <path d="M 330 255 L 450 290" class="flow-line" fill="none" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow-minimal)" />

    <!-- Inputs -> Core -->
    <path d="M 330 380 L 450 355" class="flow-line" fill="none" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow-minimal)" />

    <!-- Core -> Routing -->
    <path d="M 720 300 L 810 260" class="flow-line" fill="none" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow-minimal)" />
    <path d="M 720 345 L 810 345" class="flow-line" fill="none" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow-minimal)" />

    <!-- Routing -> Results -->
    <path d="M 980 345 L 1030 345" class="flow-line" fill="none" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow-minimal)" />

    <!-- Core <-> Channels -->
    <path d="M 530 510 L 530 580" class="flow-state" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-minimal)" />
    <path d="M 590 575 L 590 515" class="flow-state" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-minimal)" />

    <!-- Core -> HITL -->
    <path d="M 720 420 L 810 500" class="flow-dash-4" fill="none" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow-minimal)" />

    <!-- Core <-> Checkpointing -->
    <path d="M 460 485 L 350 585" class="flow-state" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-minimal)" />
    <path d="M 350 620 L 460 520" class="flow-state" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-minimal)" />

    <!-- Artifacts -> Core -->
    <path d="M 350 740 L 510 520" class="flow-state" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-minimal)" />

    <!-- Core -> Artifacts -->
    <path d="M 620 520 L 760 735" class="flow-state" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-minimal)" />

    <!-- Core -> Events -->
    <path d="M 720 465 L 850 650" class="flow-dash-4" fill="none" stroke="#d1d5db" stroke-width="2" marker-end="url(#arrow-minimal)" />

    <!-- Line labels -->
    <g class="animate-node delay-6">
      <text x="382" y="260" fill="#787774" font-size="11" text-anchor="middle">topology</text>
      <text x="390" y="370" fill="#787774" font-size="11" text-anchor="middle">context</text>
      <text x="765" y="292" fill="#787774" font-size="11" text-anchor="middle">edges</text>
      <text x="765" y="335" fill="#787774" font-size="11" text-anchor="middle">outputs</text>
      <text x="557" y="555" fill="#9ca3af" font-size="11" text-anchor="middle">read / write</text>
      <text x="410" y="560" fill="#9ca3af" font-size="11" text-anchor="middle">resume</text>
      <text x="770" y="488" fill="#787774" font-size="11" text-anchor="middle">suspend</text>
      <text x="700" y="640" fill="#9ca3af" font-size="11" text-anchor="middle">materialize</text>
    </g>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- NODES                                           -->
    <!-- ═══════════════════════════════════════════════ -->

    <!-- Graph Definition -->
    <g transform="translate(110, 180)">
      <g class="animate-node delay-1 node-group">
        <rect class="interactive-rect" width="220" height="145" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="110" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Graph Definition</text>
        <rect x="18" y="48" width="184" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="110" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Start · Handler · Router</text>
        <rect x="18" y="80" width="184" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="110" y="97" fill="#37352f" font-size="11.5" text-anchor="middle">SubGraph · Map · End</text>
        <text x="110" y="123" fill="#787774" font-size="10.5" text-anchor="middle">versioned nodes, edges,</text>
        <text x="110" y="137" fill="#787774" font-size="10.5" text-anchor="middle">ports, metadata</text>
      </g>
    </g>

    <!-- Inputs -->
    <g transform="translate(110, 350)">
      <g class="animate-node delay-2 node-group">
        <rect class="interactive-rect" width="220" height="110" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="110" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Execution Inputs</text>
        <rect x="18" y="48" width="184" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="110" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">HandlerInputs</text>
        <text x="110" y="90" fill="#787774" font-size="10.5" text-anchor="middle">typed access to upstream outputs</text>
      </g>
    </g>

    <!-- HPD-Graph Core -->
    <g transform="translate(450, 210)">
      <g class="animate-node delay-3 node-group">
        <rect class="interactive-rect core-pulse" width="270" height="310" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="2" />
        <text x="135" y="35" fill="#37352f" font-size="16" font-weight="600" text-anchor="middle">HPD-Graph Core</text>
        <text x="135" y="53" fill="#787774" font-size="12" text-anchor="middle">orchestrated node execution</text>

        <rect x="22" y="72" width="226" height="28" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="135" y="90" fill="#37352f" font-size="12" text-anchor="middle">Topological Layers</text>

        <rect x="22" y="108" width="226" height="28" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="135" y="126" fill="#37352f" font-size="12" text-anchor="middle">Parallel Node Execution</text>

        <rect x="22" y="144" width="226" height="28" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="135" y="162" fill="#37352f" font-size="12" text-anchor="middle">Cycles + Convergence</text>

        <rect x="22" y="180" width="226" height="28" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="135" y="198" fill="#37352f" font-size="12" text-anchor="middle">Retry + Error Policies</text>

        <rect x="22" y="216" width="226" height="28" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="135" y="234" fill="#37352f" font-size="12" text-anchor="middle">Suspend + Resume</text>

        <rect x="22" y="252" width="226" height="34" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="135" y="272" fill="#787774" font-size="11" text-anchor="middle">Success · Failure · Skipped</text>
        <text x="135" y="284" fill="#787774" font-size="11" text-anchor="middle">Suspended · Cancelled</text>
      </g>
    </g>

    <!-- Routing -->
    <g transform="translate(810, 205)">
      <g class="animate-node delay-4 node-group">
        <rect class="interactive-rect" width="170" height="145" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="85" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Routing</text>
        <rect x="14" y="48" width="142" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="85" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Edge Conditions</text>
        <rect x="14" y="80" width="142" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="85" y="97" fill="#37352f" font-size="11.5" text-anchor="middle">Multi-Port Outputs</text>
        <text x="85" y="123" fill="#787774" font-size="10.5" text-anchor="middle">priority, fallback,</text>
        <text x="85" y="137" fill="#787774" font-size="10.5" text-anchor="middle">delay, schedule</text>
      </g>
    </g>

    <!-- Results -->
    <g transform="translate(1030, 295)">
      <g class="animate-node delay-5 node-group">
        <rect class="interactive-rect" width="130" height="100" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="65" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Graph Result</text>
        <text x="65" y="54" fill="#787774" font-size="10.5" text-anchor="middle">final outputs</text>
        <text x="65" y="69" fill="#787774" font-size="10.5" text-anchor="middle">node states</text>
        <text x="65" y="84" fill="#787774" font-size="10.5" text-anchor="middle">summary</text>
      </g>
    </g>

    <!-- HITL -->
    <g transform="translate(810, 475)">
      <g class="animate-node delay-4 node-group">
        <rect class="interactive-rect" width="220" height="110" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="110" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Human / External Waits</text>
        <rect x="18" y="48" width="184" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="110" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Approval · Polling</text>
        <text x="110" y="90" fill="#787774" font-size="10.5" text-anchor="middle">callbacks, resources, schedules</text>
      </g>
    </g>

    <!-- Channels -->
    <g transform="translate(450, 600)">
      <g class="animate-node delay-4 node-group">
        <rect class="interactive-rect" width="270" height="130" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="135" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Channels</text>
        <rect x="18" y="48" width="110" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="73" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Last Value</text>
        <rect x="142" y="48" width="110" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="197" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Append</text>
        <rect x="18" y="80" width="110" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="73" y="97" fill="#37352f" font-size="11.5" text-anchor="middle">Reducer</text>
        <rect x="142" y="80" width="110" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="197" y="97" fill="#37352f" font-size="11.5" text-anchor="middle">Barrier</text>
        <text x="135" y="120" fill="#787774" font-size="10.5" text-anchor="middle">typed state and fan-in semantics</text>
      </g>
    </g>

    <!-- Checkpointing -->
    <g transform="translate(120, 560)">
      <g class="animate-node delay-4 node-group">
        <rect class="interactive-rect" width="210" height="120" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="105" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Checkpointing</text>
        <rect x="18" y="48" width="174" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="105" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Completed Nodes</text>
        <rect x="18" y="80" width="174" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="105" y="97" fill="#37352f" font-size="11.5" text-anchor="middle">Channel + Context State</text>
      </g>
    </g>

    <!-- Artifacts and Partitions -->
    <g transform="translate(120, 725)">
      <g class="animate-node delay-5 node-group">
        <rect class="interactive-rect" width="250" height="120" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="125" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Artifacts + Partitions</text>
        <rect x="18" y="48" width="214" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="125" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Demand-Driven Materialization</text>
        <rect x="18" y="80" width="214" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="125" y="97" fill="#37352f" font-size="11.5" text-anchor="middle">Backfills · Lineage · Retention</text>
      </g>
    </g>

    <!-- Cache -->
    <g transform="translate(760, 720)">
      <g class="animate-node delay-5 node-group">
        <rect class="interactive-rect" width="200" height="95" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="100" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Cache</text>
        <rect x="18" y="48" width="164" height="25" rx="4" fill="#f7f7f5" stroke="#e5e7eb" stroke-width="1" />
        <text x="100" y="65" fill="#37352f" font-size="11.5" text-anchor="middle">Fingerprints</text>
        <text x="100" y="85" fill="#787774" font-size="10.5" text-anchor="middle">incremental execution</text>
      </g>
    </g>

    <!-- Events -->
    <g transform="translate(930, 620)">
      <g class="animate-node delay-5 node-group">
        <rect class="interactive-rect" width="210" height="90" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" />
        <text x="105" y="30" fill="#37352f" font-size="14" font-weight="600" text-anchor="middle">Event Stream</text>
        <text x="105" y="53" fill="#787774" font-size="10.5" text-anchor="middle">graph, layer, node lifecycle</text>
        <text x="105" y="68" fill="#787774" font-size="10.5" text-anchor="middle">routing, HITL, diagnostics</text>
      </g>
    </g>
  </g>
</svg>
