    <text x="115" y="89" fill="#ffc27d" font-size="11.5" text-anchor="middle">OpenAI · Azure · Anthropic</text>
    <rect x="22" y="106" width="186" height="26" rx="5" fill="#2f2114" stroke="#a8682f" />
