    <text x="95" y="52" fill="#9fb0c5" font-size="10.8" text-anchor="middle">embedded web API layer</text>
    <rect x="20" y="70" width="150" height="26" rx="5" fill="#172231" stroke="#2d3a49" />
    <text x="95" y="87" fill="#c7d4e5" font-size="11" text-anchor="middle">AddHPDAgent</text>
