    <text x="108" y="123" fill="#8fc6ff" font-size="11.5" text-anchor="middle">TUI + CLI</text>
    <rect x="20" y="140" width="176" height="26" rx="5" fill="#122742" stroke="#2d5f94" />
    <text x="108" y="157" fill="#8fc6ff" font-size="11.5" text-anchor="middle">Slack · Teams</text>
