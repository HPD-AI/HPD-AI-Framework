<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #0f141b;">
  <defs>
    <marker id="agent-v3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ea1b6" />
    </marker>
    <style>
      .flow {
        stroke-dasharray: 7 7;
        animation: flow 1.45s linear infinite;
      }
      .flow-soft {
        stroke-dasharray: 4 6;
        animation: flowSoft 1.8s linear infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -14; }
      }
      @keyframes flowSoft {
        to { stroke-dashoffset: -20; }
      }
      .panel {
        transition: fill 0.2s ease, stroke 0.2s ease;
      }
      .cluster:hover .panel {
        fill: #182230;
        stroke: #65a7e8;
      }
      .runtime-ring {
        animation: runtimePulse 4.5s ease-in-out infinite;
      }
      @keyframes runtimePulse {
        0%, 100% { stroke: #39506b; }
        50% { stroke: #65a7e8; }
      }
      .status {
        animation: statusBlink 1.8s ease-in-out infinite;
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <g>
    <text x="50" y="60" fill="#e6edf7" font-size="24" font-weight="650">HPD-Agent Architecture</text>
    <text x="50" y="90" fill="#9fb0c5" font-size="14">ASP.NET Hosting, Runtime Orchestration, Tools, Memory, Evaluation, and Event Streaming</text>
  </g>

  <g>
    <path d="M 286 265 L 350 265" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 350 305 L 286 305" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 540 310 L 602 310" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 602 350 L 540 350" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 655 505 L 655 635" class="flow-soft" fill="none" stroke="#65a7e8" stroke-width="1.8" marker-end="url(#agent-v3-arrow)" />
    <path d="M 725 635 L 725 505" class="flow-soft" fill="none" stroke="#65a7e8" stroke-width="1.8" marker-end="url(#agent-v3-arrow)" />
    <path d="M 790 365 L 900 365" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#agent-v3-arrow)" />
    <path d="M 790 420 L 900 520" class="flow-soft" fill="none" stroke="#65a7e8" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 602 475 L 372 610" class="flow-soft" fill="none" stroke="#65a7e8" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 372 650 L 602 500" class="flow-soft" fill="none" stroke="#65a7e8" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 690 235 L 690 165" class="flow-soft" fill="none" stroke="#65a7e8" stroke-width="1.7" marker-end="url(#agent-v3-arrow)" />
    <path d="M 256 678 L 392 766" class="flow-soft" fill="none" stroke="#65a7e8" stroke-width="1.6" marker-end="url(#agent-v3-arrow)" />
  </g>

  <g transform="translate(70, 170)" class="cluster">
    <rect class="panel" width="216" height="250" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
    <text x="108" y="32" fill="#e6edf7" font-size="15" font-weight="650" text-anchor="middle">Client Surfaces</text>
    <text x="108" y="52" fill="#9fb0c5" font-size="11" text-anchor="middle">all user-facing adapters</text>
