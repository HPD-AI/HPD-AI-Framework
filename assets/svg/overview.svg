    <text x="125" y="50" fill="#1d3557" font-size="19" font-weight="700" text-anchor="middle">HPD-Environment</text>
  </g>
  <g transform="translate(355, 338)" class="cluster">
    <rect class="panel" width="250" height="84" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="125" y="50" fill="#15803d" font-size="19" font-weight="700" text-anchor="middle">HPD-Base</text>
