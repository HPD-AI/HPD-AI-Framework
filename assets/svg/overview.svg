    <rect class="panel" width="250" height="84" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="125" y="50" fill="#3d5a80" font-size="19" font-weight="700" text-anchor="middle">HPD-ML</text>
  </g>
  <g transform="translate(355, 234)" class="cluster">
    <rect class="panel" width="250" height="84" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="125" y="50" fill="#0e7490" font-size="19" font-weight="700" text-anchor="middle">HPD-Extract</text>
  </g>
  <g transform="translate(650, 234)" class="cluster">
