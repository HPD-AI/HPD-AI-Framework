<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #ffffff;">
  <defs>
    <style>
      .panel { transition: fill 0.2s ease, stroke 0.2s ease; }
      .cluster:hover .panel { fill: #fbfdff; stroke: #6d9fd2; }
    </style>
  </defs>

  <g>
    <text x="60" y="65" fill="#243244" font-size="26" font-weight="650">HPD AI Platform &amp; Frameworks</text>
    <text x="60" y="93" fill="#627084" font-size="14">Unified C# (.NET 10) Architecture &amp; Package Ecosystem</text>
  </g>

  <!-- Row 1: Agent & Cognition -->
  <g transform="translate(60, 130)" class="cluster">
    <rect class="panel" width="250" height="84" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="125" y="50" fill="#17665d" font-size="19" font-weight="700" text-anchor="middle">HPD-Agent</text>
  </g>
  <g transform="translate(355, 130)" class="cluster">
    <rect class="panel" width="250" height="84" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="125" y="50" fill="#225b8f" font-size="19" font-weight="700" text-anchor="middle">HPD-Graph</text>
  </g>
  <g transform="translate(650, 130)" class="cluster">
    <rect class="panel" width="250" height="84" rx="8" fill="#ffffff" stroke="#d9e3ee" stroke-width="1.6" />
    <text x="125" y="50" fill="#8a4b16" font-size="19" font-weight="700" text-anchor="middle">HPD-RAG</text>
  </g>

