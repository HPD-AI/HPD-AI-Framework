      <text x="75" y="29" fill="#e6edf7" font-size="13" font-weight="650" text-anchor="middle">Map / SubGraph</text>
      <text x="75" y="49" fill="#9fb0c5" font-size="10" text-anchor="middle">fan-out · nested run</text>
    </g>

    <g transform="translate(620, 150)" class="cluster">
