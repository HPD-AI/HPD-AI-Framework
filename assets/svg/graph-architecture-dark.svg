    <text x="109" y="29" fill="#e6edf7" font-size="14" font-weight="650" text-anchor="middle">Execution Context</text>
    <rect x="24" y="45" width="170" height="24" rx="5" fill="#172231" stroke="#2d3a49" />
    <text x="109" y="61" fill="#c7d4e5" font-size="10.5" text-anchor="middle">GraphContext · HandlerInputs</text>
  </g>

  <g transform="translate(1160, 112)" class="cluster">
    <rect class="panel" width="130" height="86" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
    <text x="65" y="29" fill="#e6edf7" font-size="14" font-weight="650" text-anchor="middle">Graph Result</text>
    <text x="65" y="52" fill="#9fb0c5" font-size="10.5" text-anchor="middle">outputs · states</text>
    <text x="65" y="67" fill="#9fb0c5" font-size="10.5" text-anchor="middle">summary</text>
  </g>

  <g transform="translate(60, 238)">
    <rect width="1230" height="335" rx="10" fill="#101720" stroke="#2d3a49" stroke-width="1.6" />
    <text x="24" y="32" fill="#e6edf7" font-size="14" font-weight="650">Layered Graph Run</text>
    <text x="24" y="52" fill="#9fb0c5" font-size="10.8">Nodes become runnable when dependencies, edge conditions, schedules, and suspensions allow them.</text>

    <g opacity="0.7">
      <rect x="80" y="75" width="135" height="230" rx="8" fill="#172231" stroke="#2d3a49" stroke-dasharray="5 5" />
      <rect x="300" y="75" width="230" height="230" rx="8" fill="#172231" stroke="#2d3a49" stroke-dasharray="5 5" />
      <rect x="610" y="75" width="145" height="230" rx="8" fill="#172231" stroke="#2d3a49" stroke-dasharray="5 5" />
      <rect x="830" y="75" width="230" height="230" rx="8" fill="#172231" stroke="#2d3a49" stroke-dasharray="5 5" />
    </g>

    <g fill="#8ea1b6" font-size="10" font-weight="650" text-anchor="middle">
      <text x="147" y="95">LAYER 0</text>
      <text x="415" y="95">LAYER 1</text>
      <text x="682" y="95">ROUTE</text>
      <text x="945" y="95">LAYER 2</text>
    </g>

    <g>
      <path d="M 185 187 C 235 187 250 142 315 142" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
      <path d="M 185 187 C 235 187 250 236 315 236" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
      <path d="M 465 142 C 520 142 545 187 620 187" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
      <path d="M 465 236 C 520 236 545 187 620 187" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
      <path d="M 745 187 C 790 187 800 137 845 137" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
      <path d="M 745 187 C 790 187 800 242 845 242" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
      <path d="M 985 137 C 1040 137 1050 187 1098 187" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
      <path d="M 985 242 C 1040 242 1050 187 1098 187" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
    </g>

    <g transform="translate(95, 152)" class="cluster">
      <rect class="node" width="90" height="70" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
      <text x="45" y="30" fill="#e6edf7" font-size="13" font-weight="650" text-anchor="middle">Start</text>
      <text x="45" y="50" fill="#9fb0c5" font-size="10" text-anchor="middle">initial inputs</text>
    </g>

    <g transform="translate(315, 107)" class="cluster">
