      <text x="62" y="28" fill="#e6edf7" font-size="13" font-weight="700" text-anchor="middle">Router</text>
      <rect x="22" y="43" width="82" height="20" rx="5" fill="#2f2114" stroke="#a8682f" />
      <text x="63" y="57" fill="#ffc27d" font-size="9.5" text-anchor="middle">ports 0 · 1</text>
    </g>

    <g transform="translate(845, 102)" class="cluster">
      <rect class="node" width="140" height="70" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
      <text x="70" y="28" fill="#e6edf7" font-size="13" font-weight="650" text-anchor="middle">Condition True</text>
      <text x="70" y="49" fill="#9fb0c5" font-size="10" text-anchor="middle">priority edge</text>
    </g>

    <g transform="translate(845, 207)" class="cluster">
      <rect class="node" width="140" height="70" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
      <text x="70" y="28" fill="#e6edf7" font-size="13" font-weight="650" text-anchor="middle">Suspended</text>
      <text x="70" y="49" fill="#9fb0c5" font-size="10" text-anchor="middle">approval · polling</text>
    </g>

    <g transform="translate(1098, 152)" class="cluster">
      <rect class="node" width="86" height="70" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
      <text x="43" y="30" fill="#e6edf7" font-size="13" font-weight="650" text-anchor="middle">End</text>
      <text x="43" y="50" fill="#9fb0c5" font-size="10" text-anchor="middle">outputs</text>
    </g>

