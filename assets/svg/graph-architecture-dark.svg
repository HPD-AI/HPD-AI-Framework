<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 830" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #0f141b;">
  <defs>
    <marker id="graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ea1b6" />
    </marker>
    <style>
      .flow {
        stroke-dasharray: 7 7;
        animation: flow 1.5s linear infinite;
      }
      .soft-flow {
        stroke-dasharray: 4 6;
        animation: softFlow 1.9s linear infinite;
      }
      @keyframes flow { to { stroke-dashoffset: -14; } }
      @keyframes softFlow { to { stroke-dashoffset: -20; } }
      .panel, .node {
        transition: fill 0.2s ease, stroke 0.2s ease;
      }
      .cluster:hover .panel,
      .cluster:hover .node {
        fill: #182230;
        stroke: #65a7e8;
      }
      .pulse {
        animation: pulse 4.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { stroke: #39506b; }
        50% { stroke: #65a7e8; }
      }
      .status {
        animation: blink 1.8s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <g>
    <text x="50" y="52" fill="#e6edf7" font-size="25" font-weight="650">HPD-Graph Architecture</text>
    <text x="50" y="82" fill="#9fb0c5" font-size="14">Typed Directed Workflows, Layered Execution, Routing, Checkpointing, Artifacts, and Event Streaming</text>
  </g>

  <g>
    <path d="M 258 154 L 320 154" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
    <path d="M 518 154 L 580 154" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
    <path d="M 818 154 L 880 154" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
    <path d="M 1098 154 L 1160 154" class="flow" fill="none" stroke="#8ea1b6" stroke-width="2" marker-end="url(#graph-arrow)" />
  </g>

  <g transform="translate(60, 112)" class="cluster">
    <rect class="panel" width="198" height="86" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
    <text x="99" y="29" fill="#e6edf7" font-size="14" font-weight="650" text-anchor="middle">Graph Definition</text>
    <text x="99" y="51" fill="#9fb0c5" font-size="10.5" text-anchor="middle">Start · Handler · Router</text>
    <text x="99" y="66" fill="#9fb0c5" font-size="10.5" text-anchor="middle">Map · SubGraph · End</text>
  </g>

  <g transform="translate(320, 112)" class="cluster">
    <rect class="panel" width="198" height="86" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
    <text x="99" y="29" fill="#e6edf7" font-size="14" font-weight="650" text-anchor="middle">Compile + Validate</text>
    <rect x="24" y="45" width="150" height="24" rx="5" fill="#172231" stroke="#2d3a49" />
    <text x="99" y="61" fill="#c7d4e5" font-size="10.5" text-anchor="middle">validators · registry</text>
  </g>

  <g transform="translate(580, 112)" class="cluster">
    <rect class="panel pulse" width="238" height="86" rx="8" fill="#131a23" stroke="#39506b" stroke-width="2" />
    <text x="119" y="29" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle">Orchestrator</text>
    <rect x="24" y="45" width="190" height="24" rx="5" fill="#102c2b" stroke="#287269" />
    <text x="119" y="61" fill="#7ad7ca" font-size="10.5" text-anchor="middle">topological layers · back edges</text>
  </g>

  <g transform="translate(880, 112)" class="cluster">
