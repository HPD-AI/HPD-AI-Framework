    <rect x="20" y="50" width="86" height="24" rx="5" fill="#102c2b" stroke="#287269" />
    <text x="63" y="66" fill="#7ad7ca" font-size="10.5" text-anchor="middle">LastValue</text>
    <rect x="124" y="50" width="86" height="24" rx="5" fill="#102c2b" stroke="#287269" />
    <text x="167" y="66" fill="#7ad7ca" font-size="10.5" text-anchor="middle">Append</text>
    <rect x="20" y="84" width="86" height="24" rx="5" fill="#102c2b" stroke="#287269" />
    <text x="63" y="100" fill="#7ad7ca" font-size="10.5" text-anchor="middle">Reducer</text>
    <rect x="124" y="84" width="86" height="24" rx="5" fill="#102c2b" stroke="#287269" />
    <text x="167" y="100" fill="#7ad7ca" font-size="10.5" text-anchor="middle">Barrier</text>
    <text x="115" y="124" fill="#9fb0c5" font-size="10" text-anchor="middle">typed state and fan-in</text>
  </g>

  <g transform="translate(320, 622)" class="cluster">
    <rect class="panel" width="230" height="135" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
    <text x="115" y="31" fill="#e6edf7" font-size="15" font-weight="650" text-anchor="middle">Checkpoint + Resume</text>
    <rect x="22" y="50" width="186" height="24" rx="5" fill="#172231" stroke="#2d3a49" />
    <text x="115" y="66" fill="#c7d4e5" font-size="10.5" text-anchor="middle">completed nodes · attempts</text>
    <rect x="22" y="84" width="186" height="24" rx="5" fill="#172231" stroke="#2d3a49" />
    <text x="115" y="100" fill="#c7d4e5" font-size="10.5" text-anchor="middle">channel + context state</text>
    <text x="115" y="124" fill="#9fb0c5" font-size="10" text-anchor="middle">saved before HITL waits</text>
  </g>

  <g transform="translate(580, 622)" class="cluster">
