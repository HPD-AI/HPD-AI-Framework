    <rect x="22" y="84" width="201" height="24" rx="5" fill="#2f2114" stroke="#a8682f" />
    <text x="122" y="100" fill="#ffc27d" font-size="10.5" text-anchor="middle">lineage · backfill · retention</text>
    <text x="122" y="124" fill="#9fb0c5" font-size="10" text-anchor="middle">data products from graph nodes</text>
  </g>

  <g transform="translate(855, 622)" class="cluster">
