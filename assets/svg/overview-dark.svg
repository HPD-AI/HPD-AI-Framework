<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #0f141b;">
  <defs>
    <style>
      .panel { transition: fill 0.2s ease, stroke 0.2s ease; }
