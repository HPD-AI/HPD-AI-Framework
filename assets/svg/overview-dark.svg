  </g>

  <!-- Row 1: Agent & Cognition -->
  <g transform="translate(60, 130)" class="cluster">
    <rect class="panel" width="250" height="84" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
    <text x="125" y="50" fill="#7ad7ca" font-size="19" font-weight="700" text-anchor="middle">HPD-Agent</text>
  </g>
  <g transform="translate(355, 130)" class="cluster">
    <rect class="panel" width="250" height="84" rx="8" fill="#131a23" stroke="#2d3a49" stroke-width="1.6" />
