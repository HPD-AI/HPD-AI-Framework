name: Publish Rhodium NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing Rhodium: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable Rhodium version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack Rhodium packages
        run: |
          mkdir -p ./nupkg-rhodium

          PROJECTS=(
            # Shared dependency used by Rhodium.Events and Rhodium.Connectivity
            "HPD-AI-Framework/dotnet/shared/src/HPD-Events/HPD-Events.csproj"
            # Core Rhodium runtime libraries
            "HPD-AI-Framework/dotnet/shared/src/Rhodium/src/Rhodium.Core/Rhodium.Core.csproj"
            "HPD-AI-Framework/dotnet/shared/src/Rhodium/src/Rhodium.Data/Rhodium.Data.csproj"
            "HPD-AI-Framework/dotnet/shared/src/Rhodium/src/Rhodium.SourceGenerators/Rhodium.SourceGenerators.csproj"
            "HPD-AI-Framework/dotnet/shared/src/Rhodium/src/Rhodium.Analyzers/Rhodium.Analyzers.csproj"
            "HPD-AI-Framework/dotnet/shared/src/Rhodium/src/Rhodium.Simulation/Rhodium.Simulation.csproj"
            "HPD-AI-Framework/dotnet/shared/src/Rhodium/src/Rhodium.Connectivity/Rhodium.Connectivity.csproj"
          )

          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"

          for PROJECT in "${PROJECTS[@]}"; do
            echo "Packing $PROJECT..."
            if [ -n "$VERSION_SUFFIX" ]; then
              MSBUILDDISABLENODEREUSE=1 dotnet pack "$PROJECT" -c Release -m:1 -o ./nupkg-rhodium \
                -p:IsPackable=true \
                -p:VersionPrefix="$VERSION_PREFIX" \
                -p:VersionSuffix="$VERSION_SUFFIX"
            else
              MSBUILDDISABLENODEREUSE=1 dotnet pack "$PROJECT" -c Release -m:1 -o ./nupkg-rhodium \
                -p:IsPackable=true \
                -p:VersionPrefix="$VERSION_PREFIX"
            fi
          done

      - name: Upload Rhodium packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhodium-nuget-packages
          path: ./nupkg-rhodium/*.nupkg

      - name: Push Rhodium packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Error: NUGET_API_KEY secret is not set"
            exit 1
          fi
          dotnet nuget push ./nupkg-rhodium/*.nupkg --source https://api.nuget.org/v3/index.json --api-key $NUGET_API_KEY --skip-duplicate

      - name: Summary
        run: |
          echo "## Published Rhodium Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg-rhodium/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Rhodium packages on NuGet](https://www.nuget.org/packages?q=Rhodium)" >> $GITHUB_STEP_SUMMARY
