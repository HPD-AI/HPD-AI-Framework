name: Publish Agent NuGet Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string
      hpd_environment_version:
        description: 'HPD-Environment package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string
      hpd_extract_version:
        description: 'HPD-Extract package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string
      hpd_graph_version:
        description: 'HPD-Graph package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string
      hpd_tui_version:
        description: 'HPD-TUI package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string
      hpd_realtime_media_version:
        description: 'HPD-RealtimeMedia package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string
      hpd_events_version:
        description: 'HPD-Events package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string
      hpd_serialization_version:
        description: 'HPD-Serialization package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string
      hpd_openapi_core_version:
        description: 'HPD-OpenApi.Core package version to validate against. Defaults to latest stable on NuGet.'
        required: false
        type: string

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"

          # Parse version prefix and suffix
          # Supports: 0.2.0, 0.2.0-alpha, 0.2.0-preview.1
          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install Linux seccomp helper toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu

      - name: Prepare ripgrep binaries
        run: |
          dotnet run --file dotnet/HPD-Agent.Framework/src/HPD-Agent.Harness/HPD-Agent.Harness.Coding/Ripgrep/pack/prepare-ripgrep-binaries.cs -- \
            --project dotnet/HPD-Agent.Framework/src/HPD-Agent.Harness/HPD-Agent.Harness.Coding/HPD-Agent.Harness.Coding.csproj

      - name: Build bundled coding TUI assets
        run: dotnet build dotnet/HPD-Agent.Framework/src/HPD-Agent.Harness/HPD-Agent.Harness.Coding.TUI/HPD-Agent.Harness.Coding.TUI.csproj --configuration Release

      - name: Validate and pack Agent packages
        env:
          INPUT_HPD_ENVIRONMENT_VERSION: ${{ inputs.hpd_environment_version }}
          INPUT_HPD_EXTRACT_VERSION: ${{ inputs.hpd_extract_version }}
          INPUT_HPD_GRAPH_VERSION: ${{ inputs.hpd_graph_version }}
          INPUT_HPD_TUI_VERSION: ${{ inputs.hpd_tui_version }}
          INPUT_HPD_REALTIME_MEDIA_VERSION: ${{ inputs.hpd_realtime_media_version }}
          INPUT_HPD_EVENTS_VERSION: ${{ inputs.hpd_events_version }}
          INPUT_HPD_SERIALIZATION_VERSION: ${{ inputs.hpd_serialization_version }}
          INPUT_HPD_OPENAPI_CORE_VERSION: ${{ inputs.hpd_openapi_core_version }}
        run: |
          mkdir -p ./nupkg

          PROJECTS=(
            # Core
            "dotnet/HPD-Agent.Framework/src/HPD-Agent/HPD-Agent.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Audio/HPD-Agent.Audio.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.FFI/HPD-Agent.FFI.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.MCP/HPD-Agent.MCP.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.TextExtraction/HPD-Agent.TextExtraction.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Hosting/HPD-Agent.Hosting.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.AspNetCore/HPD-Agent.AspNetCore.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Sandbox/HPD-Agent.Sandbox.Core/HPD-Agent.Sandbox.Core.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Sandbox/HPD-Agent.Sandbox.Local/HPD-Agent.Sandbox.Local.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Sandbox/HPD-Agent.Sandbox.AppleVirtualization/HPD-Agent.Sandbox.AppleVirtualization.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.MultiAgent/HPD-Agent.MultiAgent.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Evaluations/HPD-Agent.Evaluations.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.OpenApi/HPD-Agent.OpenApi.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.TUI/HPD-Agent.TUI.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.ModelsDev/HPD-Agent.ModelsDev.csproj"
            # ToolHarnesses
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Harness/HPD-Agent.Harness.WebSearch/HPD-Agent.Harness.WebSearch.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Harness/HPD-Agent.Harness.Coding/HPD-Agent.Harness.Coding.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Harness/HPD-Agent.Harness.Coding.TUI/HPD-Agent.Harness.Coding.TUI.csproj"
            # Providers
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers.Audio/HPD-Agent.Providers.Audio.OpenAI/HPD-Agent.Providers.Audio.OpenAI.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers.Audio/HPD-Agent.Providers.Audio.ElevenLabs/HPD-Agent.Providers.Audio.ElevenLabs.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers.Audio/HPD-Agent.Providers.Audio.Silero/HPD-Agent.Providers.Audio.Silero.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers.Audio/HPD-Agent.Providers.Audio.Meai/HPD-Agent.Providers.Audio.Meai.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.Anthropic/HPD-Agent.Providers.Anthropic.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.AzureAI/HPD-Agent.Providers.AzureAI.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.Bedrock/HPD-Agent.Providers.Bedrock.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.GoogleAI/HPD-Agent.Providers.GoogleAI.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.HuggingFace/HPD-Agent.Providers.HuggingFace.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.Mistral/HPD-Agent.Providers.Mistral.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.Ollama/HPD-Agent.Providers.Ollama.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.OnnxRuntime/HPD-Agent.Providers.OnnxRuntime.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.OpenAI/HPD-Agent.Providers.OpenAI.csproj"
            "dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers/HPD-Agent.Providers.OpenRouter/HPD-Agent.Providers.OpenRouter.csproj"
          )

          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"

          dotnet/eng/nuget/validate-package-identities.sh "${PROJECTS[@]}"

          resolve_nuget_version() {
            local package_id="$1"
            local override="$2"
            if [ -n "$override" ]; then
              echo "$override"
              return
            fi

            local package_id_lower
            package_id_lower="$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')"
            local response
            if ! response="$(curl -fsSL "https://api.nuget.org/v3-flatcontainer/$package_id_lower/index.json")"; then
              echo "::error::NuGet package '$package_id' is not published yet or could not be resolved."
              echo "::error::Publish that dependency package first, or provide an explicit version input if the package ID changed."
              exit 1
            fi

            printf '%s' "$response" | python3 -c 'import json, sys; versions = json.load(sys.stdin)["versions"]; stable = [version for version in versions if "-" not in version]; print((stable or versions)[-1])'
          }

          HPD_ENVIRONMENT_VERSION="$(resolve_nuget_version "HPD-Environment.Abstractions" "$INPUT_HPD_ENVIRONMENT_VERSION")"
          HPD_EXTRACT_VERSION="$(resolve_nuget_version "HPD-Extract" "$INPUT_HPD_EXTRACT_VERSION")"
          HPD_GRAPH_VERSION="$(resolve_nuget_version "HPD-Graph.Core" "$INPUT_HPD_GRAPH_VERSION")"
          HPD_TUI_VERSION="$(resolve_nuget_version "HPD-TUI" "$INPUT_HPD_TUI_VERSION")"
          HPD_REALTIME_MEDIA_VERSION="$(resolve_nuget_version "HPD-Audio.Primitives" "$INPUT_HPD_REALTIME_MEDIA_VERSION")"
          HPD_EVENTS_VERSION="$(resolve_nuget_version "HPD-Events" "$INPUT_HPD_EVENTS_VERSION")"
          HPD_SERIALIZATION_VERSION="$(resolve_nuget_version "HPD-Serialization" "$INPUT_HPD_SERIALIZATION_VERSION")"
          HPD_OPENAPI_CORE_VERSION="$(resolve_nuget_version "HPD-OpenApi.Core" "$INPUT_HPD_OPENAPI_CORE_VERSION")"

          echo "Using published HPD dependency versions:"
          echo "  HPD-Environment.*: $HPD_ENVIRONMENT_VERSION"
          echo "  HPD-Extract: $HPD_EXTRACT_VERSION"
          echo "  HPD-Graph.*: $HPD_GRAPH_VERSION"
          echo "  HPD-TUI: $HPD_TUI_VERSION"
          echo "  HPD-RealtimeMedia: $HPD_REALTIME_MEDIA_VERSION"
          echo "  HPD-Events: $HPD_EVENTS_VERSION"
          echo "  HPD-Serialization: $HPD_SERIALIZATION_VERSION"
          echo "  HPD-OpenApi.Core: $HPD_OPENAPI_CORE_VERSION"

          PUBLISHED_HPD_PROPS=(
            "-p:UsePublishedHpdDependencies=true"
            "-p:HPDEnvironmentVersion=$HPD_ENVIRONMENT_VERSION"
            "-p:HPDExtractVersion=$HPD_EXTRACT_VERSION"
            "-p:HPDGraphVersion=$HPD_GRAPH_VERSION"
            "-p:HPDTuiVersion=$HPD_TUI_VERSION"
            "-p:HPDRealtimeMediaVersion=$HPD_REALTIME_MEDIA_VERSION"
            "-p:HPDEventsVersion=$HPD_EVENTS_VERSION"
            "-p:HPDSerializationVersion=$HPD_SERIALIZATION_VERSION"
            "-p:HPDOpenApiCoreVersion=$HPD_OPENAPI_CORE_VERSION"
          )

          echo "Validating Agent packages against published HPD dependencies..."
          for PROJECT in "${PROJECTS[@]}"; do
            echo "Validating $PROJECT..."
            if ! dotnet build "$PROJECT" -c Release --nologo -v:q /clp:ErrorsOnly "${PUBLISHED_HPD_PROPS[@]}"; then
              echo "::error::Agent does not build against the currently published HPD dependency packages."
              echo "::error::This release likely depends on unpublished HPD framework/package changes, or one of the dependency version inputs is wrong."
              echo "::error::Publish/update the dependency package first, then rerun the Agent release."
              exit 1
            fi
          done

          for PROJECT in "${PROJECTS[@]}"; do
            echo "Packing $PROJECT..."
            if [ -n "$VERSION_SUFFIX" ]; then
              dotnet pack "$PROJECT" -c Release -o ./nupkg \
                -p:VersionPrefix="$VERSION_PREFIX" \
                -p:VersionSuffix="$VERSION_SUFFIX" \
                "${PUBLISHED_HPD_PROPS[@]}"
            else
              dotnet pack "$PROJECT" -c Release -o ./nupkg \
                -p:VersionPrefix="$VERSION_PREFIX" \
                "${PUBLISHED_HPD_PROPS[@]}"
            fi
          done

      - name: Validate sandbox native helper package contents
        run: |
          SANDBOX_PACKAGE="$(ls ./nupkg/HPD-Agent.Sandbox.Core.*.nupkg | head -n 1)"
          if [ -z "$SANDBOX_PACKAGE" ]; then
            echo "HPD-Agent.Sandbox.Core package was not produced"
            exit 1
          fi

          unzip -l "$SANDBOX_PACKAGE" | tee /tmp/hpd-sandbox-package.txt
          grep -q "runtimes/linux-x64/native/apply-seccomp-x64" /tmp/hpd-sandbox-package.txt
          grep -q "runtimes/linux-arm64/native/apply-seccomp-arm64" /tmp/hpd-sandbox-package.txt

      - name: Validate coding package contents
        run: |
          CODING_PACKAGE="$(ls ./nupkg/HPD-Agent.ToolHarness.Coding.*.nupkg | head -n 1)"
          CODING_TUI_PACKAGE="$(ls ./nupkg/HPD-Agent.Harness.Coding.TUI.*.nupkg | head -n 1)"

          if [ -z "$CODING_PACKAGE" ]; then
            echo "HPD-Agent.ToolHarness.Coding package was not produced"
            exit 1
          fi

          if [ -z "$CODING_TUI_PACKAGE" ]; then
            echo "HPD-Agent.Harness.Coding.TUI package was not produced"
            exit 1
          fi

          unzip -l "$CODING_PACKAGE" | tee /tmp/hpd-coding-package.txt
          grep -q "analyzers/dotnet/cs/HPD-Agent.Harness.Coding.SourceGenerator.dll" /tmp/hpd-coding-package.txt

          unzip -l "$CODING_TUI_PACKAGE" | tee /tmp/hpd-coding-tui-package.txt
          grep -q "lib/net10.0/HPD-Agent.Harness.Coding.TUI.dll" /tmp/hpd-coding-tui-package.txt

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-nuget-packages
          path: ./nupkg/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: HPD-RESEARCH

      - name: Push to NuGet
        env:
          TRUSTED_NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          NUGET_KEY="$TRUSTED_NUGET_API_KEY"
          if [ -z "$NUGET_KEY" ]; then
            echo "Trusted publishing did not return a key; using NUGET_API_KEY fallback."
            NUGET_KEY="$FALLBACK_NUGET_API_KEY"
          fi
          if [ -z "$NUGET_KEY" ]; then
            echo "No NuGet API key available. Configure trusted publishing or set the NUGET_API_KEY secret."
            exit 1
          fi
          dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_KEY" --skip-duplicate

      - name: Summary
        run: |
          echo "## Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View HPD-Agent packages on NuGet](https://www.nuget.org/packages?q=HPD-Agent)" >> $GITHUB_STEP_SUMMARY
