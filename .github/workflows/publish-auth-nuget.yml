name: Publish HPD-Auth NuGet Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing HPD-Auth: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable HPD-Auth version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack HPD-Auth packages
        run: |
          mkdir -p ./nupkg-auth

          PROJECTS=(
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.Core/HPD.Auth.Core.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.Infrastructure/HPD.Auth.Infrastructure.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth/HPD.Auth.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.Authentication/HPD.Auth.Authentication.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.Authorization/HPD.Auth.Authorization.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.Audit/HPD.Auth.Audit.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.TwoFactor/HPD.Auth.TwoFactor.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.OAuth/HPD.Auth.OAuth.csproj"
            "dotnet/HPD-Auth.Framework/src/HPD.Auth.Admin/HPD.Auth.Admin.csproj"
          )

          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"

          dotnet/eng/nuget/validate-package-identities.sh "${PROJECTS[@]}"

          for PROJECT in "${PROJECTS[@]}"; do
            echo "Packing $PROJECT..."
            if [ -n "$VERSION_SUFFIX" ]; then
              dotnet pack "$PROJECT" -c Release -o ./nupkg-auth \
                -p:VersionPrefix="$VERSION_PREFIX" \
                -p:VersionSuffix="$VERSION_SUFFIX"
            else
              dotnet pack "$PROJECT" -c Release -o ./nupkg-auth \
                -p:VersionPrefix="$VERSION_PREFIX"
            fi
          done

      - name: Upload HPD-Auth packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auth-nuget-packages
          path: ./nupkg-auth/*.nupkg

      - name: Push HPD-Auth packages to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_KEY" ]; then
            echo "No NuGet API key available. Set the NUGET_API_KEY repository secret."
            exit 1
          fi
          dotnet nuget push ./nupkg-auth/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_KEY" --skip-duplicate

      - name: Summary
        run: |
          echo "## Published HPD-Auth Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg-auth/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View HPD-Auth packages on NuGet](https://www.nuget.org/packages?q=HPD-Auth)" >> $GITHUB_STEP_SUMMARY
