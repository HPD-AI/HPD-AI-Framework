name: TypeScript Build and Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'typescript/hpd-agent-*/**'
      - 'dotnet/HPD-Agent.Framework/src/**'
      - 'dotnet/HPD-Agent.Framework/eng/check-typescript-sdk.sh'
      - 'dotnet/HPD-Agent.Framework/test/HPD-Agent.AspNetCore.OpenApi.Tests/**'
      - '.github/workflows/typescript-build-and-test.yml'
      - 'global.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-generated-agent-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: bash dotnet/HPD-Agent.Framework/eng/check-typescript-sdk.sh

  test-agent-sdk-and-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: SDK build and lifecycle tests
        working-directory: typescript/hpd-agent-client
        run: |
          npm install --no-package-lock
          npm test
          npm run type-test
          npm run conformance -- ../../dotnet/HPD-Agent.Framework/sdk/conformance/fixtures/conformance-v1.json

      - name: ACP build and tests
        working-directory: typescript/hpd-agent-acp
        run: |
          npm ci
          npm run build
          npm test

      - name: Headless UI build and tests
        working-directory: typescript/hpd-agent-headless-ui
        run: |
          npm ci
          npm run build
          npm test

      - name: Svelte checks and tests
        working-directory: typescript/hpd-agent-headless-ui-svelte
        run: |
          npm ci
          npm run check
          npm test
