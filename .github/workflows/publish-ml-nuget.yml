name: Publish HPD-ML NuGet Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing HPD-ML: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable HPD-ML version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack HPD-ML packages
        run: |
          mkdir -p ./nupkg-ml

          PROJECTS=(
            # HPD-ML packages
            "dotnet/HPD-ML.Framework/src/HPD.ML.Abstractions/HPD.ML.Abstractions.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Backends.Abstractions/HPD.ML.Backends.Abstractions.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Core/HPD.ML.Core.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.DeepLearning/HPD.ML.DeepLearning.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Backends/HPD.ML.Backends.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.BinaryClassification/HPD.ML.BinaryClassification.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Clustering/HPD.ML.Clustering.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.DataSources/HPD.ML.DataSources.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Evaluation/HPD.ML.Evaluation.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.LightGBM/HPD.ML.LightGBM.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Regression/HPD.ML.Regression.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Serialization.Zip/HPD.ML.Serialization.Zip.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.TimeSeries/HPD.ML.TimeSeries.csproj"
            "dotnet/HPD-ML.Framework/src/HPD.ML.Transforms/HPD.ML.Transforms.csproj"
          )

          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"

          dotnet/eng/nuget/validate-package-identities.sh "${PROJECTS[@]}"

          for PROJECT in "${PROJECTS[@]}"; do
            echo "Packing $PROJECT..."
            if [ -n "$VERSION_SUFFIX" ]; then
              MSBUILDDISABLENODEREUSE=1 dotnet pack "$PROJECT" -c Release -m:1 -o ./nupkg-ml \
                -p:IsPackable=true \
                -p:VersionPrefix="$VERSION_PREFIX" \
                -p:VersionSuffix="$VERSION_SUFFIX"
            else
              MSBUILDDISABLENODEREUSE=1 dotnet pack "$PROJECT" -c Release -m:1 -o ./nupkg-ml \
                -p:IsPackable=true \
                -p:VersionPrefix="$VERSION_PREFIX"
            fi
          done

      - name: Upload HPD-ML packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-nuget-packages
          path: ./nupkg-ml/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: HPD-RESEARCH

      - name: Push HPD-ML packages to NuGet
        env:
          TRUSTED_NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          NUGET_KEY="$TRUSTED_NUGET_API_KEY"
          if [ -z "$NUGET_KEY" ]; then
            echo "Trusted publishing did not return a key; using NUGET_API_KEY fallback."
            NUGET_KEY="$FALLBACK_NUGET_API_KEY"
          fi
          if [ -z "$NUGET_KEY" ]; then
            echo "No NuGet API key available. Configure trusted publishing or set the NUGET_API_KEY secret."
            exit 1
          fi
          dotnet nuget push ./nupkg-ml/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_KEY" --skip-duplicate

      - name: Summary
        run: |
          echo "## Published HPD-ML Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg-ml/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View HPD-ML packages on NuGet](https://www.nuget.org/packages?q=HPD-ML)" >> $GITHUB_STEP_SUMMARY
