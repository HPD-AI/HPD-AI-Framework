name: Qualify Agent Silero VAD

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dotnet/HPD-Agent.Framework/eng/fetch-silero-vad-v6.2.sh'
      - 'dotnet/HPD-Agent.Framework/eng/qualify-silero-vad.sh'
      - 'dotnet/HPD-Agent.Framework/src/HPD-Agent.Providers.Audio/HPD-Agent.Providers.Audio.Silero/**'
      - 'dotnet/HPD-Agent.Framework/test/HPD-Agent.Audio.VoiceActivity.AotSmoke/**'
      - 'dotnet/HPD-Agent.Framework/test/HPD.Agent.Audio.V2.Tests/VoiceActivity/SileroAudioProviderV1Tests.cs'
      - '.github/workflows/agent-silero-qualification.yml'

permissions:
  contents: read

jobs:
  native-aot-and-soak:
    name: Silero NativeAOT (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runtime: linux-x64 }
          - { os: ubuntu-24.04-arm, runtime: linux-arm64 }
          - { os: macos-15-intel, runtime: osx-x64 }
          - { os: macos-14, runtime: osx-arm64 }
          - { os: windows-latest, runtime: win-x64 }
          - { os: windows-11-arm, runtime: win-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup supported .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Run provider, corpus, WAE, NativeAOT and million-window gates
        shell: bash
        run: dotnet/HPD-Agent.Framework/eng/qualify-silero-vad.sh "${{ matrix.runtime }}"
