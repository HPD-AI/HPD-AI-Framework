name: Publish HPD-Graph NuGet Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string
      hpd_base_version:
        description: 'Published HPD.Base version. Defaults to latest stable on NuGet.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      hpd_base_version:
        description: 'Published HPD.Base version'
        required: true
        type: string
    secrets:
      NUGET_API_KEY:
        required: true

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing HPD-Graph: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable HPD-Graph version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack HPD-Graph packages
        env:
          INPUT_HPD_BASE_VERSION: ${{ inputs.hpd_base_version }}
        run: |
          set -euo pipefail
          mkdir -p ./nupkg-graph

          PROJECTS=(
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Abstractions/HPD-Graph.Abstractions.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.SourceGenerator/HPD-Graph.SourceGenerator.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Core/HPD-Graph.Core.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Base/HPD-Graph.Base.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.SourceGenerator/HPD-Graph.Connectors.SourceGenerator.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.Abstractions/HPD-Graph.Connectors.Abstractions.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.Core/HPD-Graph.Connectors.Core.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.AspNetCore/HPD-Graph.Connectors.AspNetCore.csproj"
            "dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.OpenApi/HPD-Graph.Connectors.OpenApi.csproj"
          )

          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"
          HPD_BASE_VERSION="$INPUT_HPD_BASE_VERSION"
          if [[ -z "$HPD_BASE_VERSION" ]]; then
            HPD_BASE_VERSION="$(
              curl -fsSL "https://api.nuget.org/v3-flatcontainer/hpd-base/index.json" |
                python3 -c 'import json,sys; versions=json.load(sys.stdin)["versions"]; stable=[v for v in versions if "-" not in v]; print((stable or versions)[-1])'
            )"
          fi

          PUBLISHED_HPD_PROPS=(
            "-p:UsePublishedHpdDependencies=true"
            "-p:HPDBaseVersion=$HPD_BASE_VERSION"
          )

          dotnet/eng/nuget/validate-package-identities.sh "${PROJECTS[@]}"

          for PROJECT in "${PROJECTS[@]}"; do
            echo "Packing $PROJECT..."
            if [ -n "$VERSION_SUFFIX" ]; then
              dotnet pack "$PROJECT" -c Release -o ./nupkg-graph \
                -p:VersionPrefix="$VERSION_PREFIX" \
                -p:VersionSuffix="$VERSION_SUFFIX" \
                "${PUBLISHED_HPD_PROPS[@]}"
            else
              dotnet pack "$PROJECT" -c Release -o ./nupkg-graph \
                -p:VersionPrefix="$VERSION_PREFIX" \
                "${PUBLISHED_HPD_PROPS[@]}"
            fi
          done

      - name: Upload HPD-Graph packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graph-nuget-packages
          path: ./nupkg-graph/*.nupkg

      - name: Push HPD-Graph packages to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_KEY" ]; then
            echo "No NuGet API key available. Set the NUGET_API_KEY repository secret."
            exit 1
          fi
          dotnet nuget push ./nupkg-graph/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_KEY" --skip-duplicate

      - name: Wait for NuGet package availability
        env:
          PACKAGE_VERSION: ${{ needs.determine-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_IDS=(
            "HPD-Graph.Abstractions"
            "HPD-Graph.Core"
            "HPD-Graph.Base"
          )
          VERSION_LOWER="${PACKAGE_VERSION,,}"

          for attempt in {1..60}; do
            all_available=true
            for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
              PACKAGE_ID_LOWER="${PACKAGE_ID,,}"
              PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID_LOWER/$VERSION_LOWER/$PACKAGE_ID_LOWER.$VERSION_LOWER.nupkg"
              if ! curl -fsSL -o /dev/null "$PACKAGE_URL"; then
                all_available=false
              fi
            done

            if [[ "$all_available" == "true" ]]; then
              echo "All HPD-Graph $PACKAGE_VERSION packages are available from NuGet."
              exit 0
            fi
            echo "Waiting for HPD-Graph $PACKAGE_VERSION to become available (attempt $attempt/60)..."
            sleep 10
          done

          echo "::error::HPD-Graph $PACKAGE_VERSION did not become available within 10 minutes."
          exit 1

      - name: Summary
        run: |
          echo "## Published HPD-Graph Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg-graph/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View HPD-Graph packages on NuGet](https://www.nuget.org/packages?q=HPD-Graph)" >> $GITHUB_STEP_SUMMARY
