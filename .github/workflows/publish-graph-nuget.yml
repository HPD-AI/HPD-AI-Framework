name: Publish HPD-Graph NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing HPD-Graph: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable HPD-Graph version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack HPD-Graph packages
        run: |
          mkdir -p ./nupkg-graph

          PROJECTS=(
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Abstractions/HPD-Graph.Abstractions.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.SourceGenerator/HPD-Graph.SourceGenerator.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Core/HPD-Graph.Core.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Hosting/HPD-Graph.Hosting.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.AspNetCore/HPD-Graph.AspNetCore.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.SourceGenerator/HPD-Graph.Connectors.SourceGenerator.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.Abstractions/HPD-Graph.Connectors.Abstractions.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.Core/HPD-Graph.Connectors.Core.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.AspNetCore/HPD-Graph.Connectors.AspNetCore.csproj"
            "HPD-AI-Framework/dotnet/HPD-Graph.Framework/src/HPD-Graph.Connectors/HPD-Graph.Connectors.OpenApi/HPD-Graph.Connectors.OpenApi.csproj"
          )

          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"

          HPD-AI-Framework/dotnet/eng/nuget/validate-package-identities.sh "${PROJECTS[@]}"

          for PROJECT in "${PROJECTS[@]}"; do
            echo "Packing $PROJECT..."
            if [ -n "$VERSION_SUFFIX" ]; then
              dotnet pack "$PROJECT" -c Release -o ./nupkg-graph \
                -p:VersionPrefix="$VERSION_PREFIX" \
                -p:VersionSuffix="$VERSION_SUFFIX"
            else
              dotnet pack "$PROJECT" -c Release -o ./nupkg-graph \
                -p:VersionPrefix="$VERSION_PREFIX"
            fi
          done

      - name: Upload HPD-Graph packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graph-nuget-packages
          path: ./nupkg-graph/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push HPD-Graph packages to NuGet
        run: dotnet nuget push ./nupkg-graph/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Summary
        run: |
          echo "## Published HPD-Graph Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg-graph/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View HPD-Graph packages on NuGet](https://www.nuget.org/packages?q=HPD-Graph)" >> $GITHUB_STEP_SUMMARY
