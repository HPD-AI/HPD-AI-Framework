name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-x64
            name: darwin-x64
          - os: macos-latest-xlarge
            rid: osx-arm64
            name: darwin-arm64
          - os: ubuntu-latest
            rid: linux-x64
            name: linux-x64
          - os: ubuntu-latest-arm
            rid: linux-arm64
            name: linux-arm64
          - os: windows-latest
            rid: win-x64
            name: windows-x64
          - os: windows-latest-arm64
            rid: win-arm64
            name: windows-arm64

    steps:
      - name: Configure Git for long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify HPD-AI-Framework structure
        shell: bash
        run: |
          echo "Checking HPD-AI-Framework structure..."
          ls -la HPD-AI-Framework/dotnet/ || echo "HPD-AI-Framework/dotnet directory not found"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore required submodule projects
        run: |
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.SourceGenerator/HPD-Agent.SourceGenerator.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent/HPD-Agent.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.AspNetCore/HPD-Agent.AspNetCore.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.OpenAI/HPD-Agent.Providers.OpenAI.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.Anthropic/HPD-Agent.Providers.Anthropic.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.GoogleAI/HPD-Agent.Providers.GoogleAI.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.OpenRouter/HPD-Agent.Providers.OpenRouter.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.Ollama/HPD-Agent.Providers.Ollama.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.Mistral/HPD-Agent.Providers.Mistral.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.AzureAI/HPD-Agent.Providers.AzureAI.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.Providers/HPD-Agent.Providers.HuggingFace/HPD-Agent.Providers.HuggingFace.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.MCP/HPD-Agent.MCP.csproj
          dotnet restore HPD-AI-Framework/dotnet/src/HPD-Agent.Framework/HPD-Agent.MultiAgent/HPD-Agent.MultiAgent.csproj

      - name: Restore CLI dependencies
        run: dotnet restore HPDOS/src-dotnet/HPDOS.CLI/HPDOS.CLI.csproj

      - name: Publish ${{ matrix.rid }}
        run: dotnet publish HPDOS/src-dotnet/HPDOS.CLI/HPDOS.CLI.csproj -c Release -r ${{ matrix.rid }} -o ./bin/${{ matrix.rid }} --self-contained --no-restore

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./bin/${{ matrix.rid }}/hpdos
          cd ./bin/${{ matrix.rid }}
          tar -czf ../hpdos-${{ matrix.name }}.tar.gz hpdos
          cd -

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd ./bin/${{ matrix.rid }}
          7z a ../hpdos-${{ matrix.name }}.zip hpdos.exe
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hpdos-${{ matrix.name }}
          path: |
            ./bin/hpdos-${{ matrix.name }}.tar.gz
            ./bin/hpdos-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten artifacts
        run: find ./artifacts -type f -exec mv {} ./artifacts/ \;

      - name: Copy install script
        run: cp HPDOS/scripts/install.sh ./artifacts/install.sh && chmod +x ./artifacts/install.sh

      - name: Generate checksums
        run: |
          cd ./artifacts
          sha256sum hpdos-* > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${{ github.ref }}"
            VERSION="${VERSION#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
