name: Publish Shared Foundation NuGet Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Shared foundation package to publish'
        required: true
        type: choice
        options:
          - HPD-Events
          - HPD-Serialization
          - HPD-OpenApi.Core
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string
  workflow_call:
    inputs:
      package:
        description: 'Shared foundation package to publish'
        required: true
        type: string
      version:
        description: 'Version to publish'
        required: true
        type: string
    secrets:
      NUGET_API_KEY:
        required: true

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing ${{ inputs.package }}: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable ${{ inputs.package }} version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Select package project
        id: package
        run: |
          case "${{ inputs.package }}" in
            HPD-Events)
              PROJECT="dotnet/shared/src/HPD-Events/HPD-Events.csproj"
              ;;
            HPD-Serialization)
              PROJECT="dotnet/shared/src/HPD-Serialization/HPD-Serialization.csproj"
              ;;
            HPD-OpenApi.Core)
              PROJECT="dotnet/shared/src/HPD-OpenApi.Core/HPD-OpenApi.Core.csproj"
              ;;
            *)
              echo "::error::Unsupported shared foundation package: ${{ inputs.package }}"
              exit 1
              ;;
          esac

          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "Selected $PROJECT"

      - name: Pack shared foundation package
        run: |
          mkdir -p ./nupkg-shared-foundations

          PROJECT="${{ steps.package.outputs.project }}"
          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"

          dotnet/eng/nuget/validate-package-identities.sh "$PROJECT"

          if [ -n "$VERSION_SUFFIX" ]; then
            dotnet pack "$PROJECT" -c Release -o ./nupkg-shared-foundations \
              -p:VersionPrefix="$VERSION_PREFIX" \
              -p:VersionSuffix="$VERSION_SUFFIX"
          else
            dotnet pack "$PROJECT" -c Release -o ./nupkg-shared-foundations \
              -p:VersionPrefix="$VERSION_PREFIX"
          fi

      - name: Upload shared foundation package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-foundation-${{ inputs.package }}-nuget-package
          path: ./nupkg-shared-foundations/*.nupkg

      - name: Push shared foundation package to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_KEY" ]; then
            echo "No NuGet API key available. Set the NUGET_API_KEY repository secret."
            exit 1
          fi
          dotnet nuget push ./nupkg-shared-foundations/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_KEY" --skip-duplicate

      - name: Wait for NuGet package availability
        env:
          PACKAGE_ID: ${{ inputs.package }}
          PACKAGE_VERSION: ${{ needs.determine-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ID_LOWER="${PACKAGE_ID,,}"
          VERSION_LOWER="${PACKAGE_VERSION,,}"
          PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID_LOWER/$VERSION_LOWER/$PACKAGE_ID_LOWER.$VERSION_LOWER.nupkg"

          for attempt in {1..60}; do
            if curl -fsSL -o /dev/null "$PACKAGE_URL"; then
              echo "$PACKAGE_ID $PACKAGE_VERSION is available from NuGet."
              exit 0
            fi
            echo "Waiting for $PACKAGE_ID $PACKAGE_VERSION to become available (attempt $attempt/60)..."
            sleep 10
          done

          echo "::error::$PACKAGE_ID $PACKAGE_VERSION did not become available within 10 minutes."
          exit 1

      - name: Summary
        run: |
          echo "## Published ${{ inputs.package }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg-shared-foundations/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
