name: Publish HPD-RealtimeMedia NuGet Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0 or 0.2.0-alpha)'
        required: true
        type: string

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_prefix: ${{ steps.version.outputs.version_prefix }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          VERSION="${VERSION#v}"

          if [[ "$VERSION" == *-* ]]; then
            VERSION_PREFIX="${VERSION%%-*}"
            VERSION_SUFFIX="${VERSION#*-}"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Publishing HPD-RealtimeMedia: $VERSION_PREFIX with suffix: $VERSION_SUFFIX"
          else
            VERSION_PREFIX="$VERSION"
            echo "version_prefix=$VERSION_PREFIX" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
            echo "Publishing stable HPD-RealtimeMedia version: $VERSION_PREFIX"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: determine-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack HPD-RealtimeMedia packages
        run: |
          mkdir -p ./nupkg-realtime-media

          PROJECTS=(
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Buffers/HPD-Buffers.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Audio.Primitives/HPD-Audio.Primitives.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Audio.Codecs/HPD-Audio.Codecs.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Audio.Codecs.G711/HPD-Audio.Codecs.G711.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Audio.Codecs.Opus/HPD-Audio.Codecs.Opus.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Audio.Connections/HPD-Audio.Connections.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Diagnostics/HPD-Media.Diagnostics.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Sdp/HPD-Media.Sdp.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Transport/HPD-Media.Transport.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Rtp/HPD-Media.Rtp.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Rtcp/HPD-Media.Rtcp.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Rtcp.Feedback/HPD-Media.Rtcp.Feedback.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Rtcp.Twcc/HPD-Media.Rtcp.Twcc.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Rtp.Audio/HPD-Media.Rtp.Audio.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Rtp.Audio.Sdp/HPD-Media.Rtp.Audio.Sdp.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Rtp.Repair/HPD-Media.Rtp.Repair.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.Srtp/HPD-Media.Srtp.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Media.WebRTC/HPD-Media.WebRTC.csproj"
            "dotnet/shared/src/HPD-RealtimeMedia/src/HPD-Audio.WebRTC/HPD-Audio.WebRTC.csproj"
          )

          VERSION_PREFIX="${{ needs.determine-version.outputs.version_prefix }}"
          VERSION_SUFFIX="${{ needs.determine-version.outputs.version_suffix }}"

          dotnet/eng/nuget/validate-package-identities.sh "${PROJECTS[@]}"

          for PROJECT in "${PROJECTS[@]}"; do
            echo "Packing $PROJECT..."
            if [ -n "$VERSION_SUFFIX" ]; then
              dotnet pack "$PROJECT" -c Release -o ./nupkg-realtime-media \
                -p:VersionPrefix="$VERSION_PREFIX" \
                -p:VersionSuffix="$VERSION_SUFFIX"
            else
              dotnet pack "$PROJECT" -c Release -o ./nupkg-realtime-media \
                -p:VersionPrefix="$VERSION_PREFIX"
            fi
          done

      - name: Upload HPD-RealtimeMedia packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: realtime-media-nuget-packages
          path: ./nupkg-realtime-media/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: HPD-RESEARCH

      - name: Push HPD-RealtimeMedia packages to NuGet
        env:
          TRUSTED_NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          NUGET_KEY="$TRUSTED_NUGET_API_KEY"
          if [ -z "$NUGET_KEY" ]; then
            echo "Trusted publishing did not return a key; using NUGET_API_KEY fallback."
            NUGET_KEY="$FALLBACK_NUGET_API_KEY"
          fi
          if [ -z "$NUGET_KEY" ]; then
            echo "No NuGet API key available. Configure trusted publishing or set the NUGET_API_KEY secret."
            exit 1
          fi
          dotnet nuget push ./nupkg-realtime-media/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_KEY" --skip-duplicate

      - name: Summary
        run: |
          echo "## Published HPD-RealtimeMedia Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.determine-version.outputs.version_suffix }}" ]; then
            echo "**Type:** Pre-release (${{ needs.determine-version.outputs.version_suffix }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages:" >> $GITHUB_STEP_SUMMARY
          for pkg in ./nupkg-realtime-media/*.nupkg; do
            echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View HPD media packages on NuGet](https://www.nuget.org/packages?q=HPD-Media)" >> $GITHUB_STEP_SUMMARY
