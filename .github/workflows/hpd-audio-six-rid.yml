name: HPD Audio six-RID NativeAOT ABI

on:
  push:
    branches: [codex/hpd-audio-release-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-abi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, rid: linux-x64, os: unix, library: HPD-Agent.Audio.TransportAbi.NativeAot.so }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64, os: unix, library: HPD-Agent.Audio.TransportAbi.NativeAot.so }
          - { runner: macos-15-intel, rid: osx-x64, os: unix, library: HPD-Agent.Audio.TransportAbi.NativeAot.dylib }
          - { runner: macos-14, rid: osx-arm64, os: unix, library: HPD-Agent.Audio.TransportAbi.NativeAot.dylib }
          - { runner: windows-2025, rid: win-x64, os: windows, arch: x64, machine: X64, library: HPD-Agent.Audio.TransportAbi.NativeAot.dll }
          - { runner: windows-11-arm, rid: win-arm64, os: windows, arch: arm64, machine: ARM64, library: HPD-Agent.Audio.TransportAbi.NativeAot.dll }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: dotnet/HPD-Agent.Framework
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Publish exact matching RID
        shell: pwsh
        run: dotnet publish test/HPD-Agent.Audio.TransportAbi.NativeAot/HPD-Agent.Audio.TransportAbi.NativeAot.csproj -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/hpd-audio-abi
      - name: Verify Unix ABI and C lifecycle
        if: matrix.os == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          lib="${RUNNER_TEMP}/hpd-audio-abi/${{ matrix.library }}"
          test -f "$lib"
          if [[ "${{ matrix.rid }}" == linux-* ]]; then symbols="$(nm -D "$lib")"; else symbols="$(nm -gU "$lib")"; fi
          count="$(printf '%s\n' "$symbols" | grep -E 'hpd_audio_transport_(create|bind|start|stop|destroy)' | wc -l | tr -d ' ')"
          test "$count" = 5
          cc -Wall -Wextra -Werror test/HPD-Agent.Audio.TransportAbi.NativeAot/transport_abi_smoke.c \
            -Itest/HPD-Agent.Audio.TransportAbi.NativeAot "$lib" \
            -Wl,-rpath,"${RUNNER_TEMP}/hpd-audio-abi" -o "${RUNNER_TEMP}/hpd-audio-abi-smoke"
          "${RUNNER_TEMP}/hpd-audio-abi-smoke"
      - name: Verify Windows ABI and C lifecycle
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hpd-audio-abi'
          $dll = Join-Path $out '${{ matrix.library }}'
          $exports = & dumpbin /exports $dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exportText = $exports -join "`n"
          foreach ($name in 'create','bind','start','stop','destroy') {
            if ($exportText -notmatch "hpd_audio_transport_$name") { throw "missing export $name" }
          }
          @('LIBRARY HPD-Agent.Audio.TransportAbi.NativeAot','EXPORTS','hpd_audio_transport_create','hpd_audio_transport_bind','hpd_audio_transport_start','hpd_audio_transport_stop','hpd_audio_transport_destroy') | Set-Content (Join-Path $out 'transport.def')
          & lib /nologo "/def:$out\transport.def" '/machine:${{ matrix.machine }}' "/out:$out\transport.lib"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & cl /nologo /W4 /WX test\HPD-Agent.Audio.TransportAbi.NativeAot\transport_abi_smoke.c /Itest\HPD-Agent.Audio.TransportAbi.NativeAot /link "$out\transport.lib" "/out:$env:RUNNER_TEMP\hpd-audio-abi-smoke.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item $dll (Join-Path $env:RUNNER_TEMP '${{ matrix.library }}')
          $env:PATH = "$out;$env:PATH"
          & "$env:RUNNER_TEMP\hpd-audio-abi-smoke.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: hpd-audio-transport-abi-${{ matrix.rid }}
          path: ${{ runner.temp }}/hpd-audio-abi
