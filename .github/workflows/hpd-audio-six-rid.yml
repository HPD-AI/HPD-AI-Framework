name: HPD Audio six-RID NativeAOT ABI

on:
  push:
    branches: [codex/hpd-audio-release-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-abi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { domain: transport, runner: ubuntu-24.04, rid: linux-x64, os: unix, project: HPD-Agent.Audio.Transport.Native, library: HPD-Agent.Audio.Transport.Native.so, prefix: hpd_audio_transport_v1_, exports: 'create|bind|start|stop|destroy', count: 5, smoke: transport_native_smoke.c }
          - { domain: transport, runner: ubuntu-24.04-arm, rid: linux-arm64, os: unix, project: HPD-Agent.Audio.Transport.Native, library: HPD-Agent.Audio.Transport.Native.so, prefix: hpd_audio_transport_v1_, exports: 'create|bind|start|stop|destroy', count: 5, smoke: transport_native_smoke.c }
          - { domain: transport, runner: macos-15-intel, rid: osx-x64, os: unix, project: HPD-Agent.Audio.Transport.Native, library: HPD-Agent.Audio.Transport.Native.dylib, prefix: hpd_audio_transport_v1_, exports: 'create|bind|start|stop|destroy', count: 5, smoke: transport_native_smoke.c }
          - { domain: transport, runner: macos-14, rid: osx-arm64, os: unix, project: HPD-Agent.Audio.Transport.Native, library: HPD-Agent.Audio.Transport.Native.dylib, prefix: hpd_audio_transport_v1_, exports: 'create|bind|start|stop|destroy', count: 5, smoke: transport_native_smoke.c }
          - { domain: transport, runner: windows-2025, rid: win-x64, os: windows, arch: x64, machine: X64, project: HPD-Agent.Audio.Transport.Native, library: HPD-Agent.Audio.Transport.Native.dll, prefix: hpd_audio_transport_v1_, exports: 'create|bind|start|stop|destroy', count: 5, smoke: transport_native_smoke_windows.c }
          - { domain: transport, runner: windows-11-arm, rid: win-arm64, os: windows, arch: arm64, machine: ARM64, project: HPD-Agent.Audio.Transport.Native, library: HPD-Agent.Audio.Transport.Native.dll, prefix: hpd_audio_transport_v1_, exports: 'create|bind|start|stop|destroy', count: 5, smoke: transport_native_smoke_windows.c }
          - { domain: replay, runner: ubuntu-24.04, rid: linux-x64, os: unix, project: HPD-Agent.Replay.Native, library: HPD-Agent.Replay.Native.so, prefix: hpd_replay_v1_, exports: 'open|advance|step|explore|status|complete|close|free', count: 8, smoke: replay_native_smoke.c }
          - { domain: replay, runner: ubuntu-24.04-arm, rid: linux-arm64, os: unix, project: HPD-Agent.Replay.Native, library: HPD-Agent.Replay.Native.so, prefix: hpd_replay_v1_, exports: 'open|advance|step|explore|status|complete|close|free', count: 8, smoke: replay_native_smoke.c }
          - { domain: replay, runner: macos-15-intel, rid: osx-x64, os: unix, project: HPD-Agent.Replay.Native, library: HPD-Agent.Replay.Native.dylib, prefix: hpd_replay_v1_, exports: 'open|advance|step|explore|status|complete|close|free', count: 8, smoke: replay_native_smoke.c }
          - { domain: replay, runner: macos-14, rid: osx-arm64, os: unix, project: HPD-Agent.Replay.Native, library: HPD-Agent.Replay.Native.dylib, prefix: hpd_replay_v1_, exports: 'open|advance|step|explore|status|complete|close|free', count: 8, smoke: replay_native_smoke.c }
          - { domain: replay, runner: windows-2025, rid: win-x64, os: windows, arch: x64, machine: X64, project: HPD-Agent.Replay.Native, library: HPD-Agent.Replay.Native.dll, prefix: hpd_replay_v1_, exports: 'open|advance|step|explore|status|complete|close|free', count: 8, smoke: replay_native_smoke_windows.c }
          - { domain: replay, runner: windows-11-arm, rid: win-arm64, os: windows, arch: arm64, machine: ARM64, project: HPD-Agent.Replay.Native, library: HPD-Agent.Replay.Native.dll, prefix: hpd_replay_v1_, exports: 'open|advance|step|explore|status|complete|close|free', count: 8, smoke: replay_native_smoke_windows.c }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: dotnet/HPD-Agent.Framework
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Publish exact matching RID
        shell: pwsh
        run: dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/hpd-native-abi
      - name: Verify Unix ABI and C lifecycle
        if: matrix.os == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          lib="${RUNNER_TEMP}/hpd-native-abi/${{ matrix.library }}"
          test -f "$lib"
          if [[ "${{ matrix.rid }}" == linux-* ]]; then symbols="$(nm -D "$lib")"; else symbols="$(nm -gU "$lib")"; fi
          count="$(printf '%s\n' "$symbols" | grep -E '${{ matrix.prefix }}(${{ matrix.exports }})' | wc -l | tr -d ' ')"
          test "$count" = '${{ matrix.count }}'
          cc -Wall -Wextra -Werror src/${{ matrix.project }}/${{ matrix.smoke }} \
            -Isrc/${{ matrix.project }} "$lib" \
            -Wl,-rpath,"${RUNNER_TEMP}/hpd-native-abi" -o "${RUNNER_TEMP}/hpd-native-abi-smoke"
          "${RUNNER_TEMP}/hpd-native-abi-smoke"
      - name: Verify Windows ABI and C lifecycle
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'hpd-native-abi'
          $dll = Join-Path $out '${{ matrix.library }}'
          $exports = & dumpbin /exports $dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exportText = $exports -join "`n"
          foreach ($name in '${{ matrix.exports }}'.Split('|')) {
            if ($exportText -notmatch "${{ matrix.prefix }}$name") { throw "missing export $name" }
          }
          & cl /nologo /W4 /WX "src\${{ matrix.project }}\${{ matrix.smoke }}" "/Isrc\${{ matrix.project }}" "/Fe:$env:RUNNER_TEMP\hpd-native-abi-smoke.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item $dll (Join-Path $env:RUNNER_TEMP '${{ matrix.library }}')
          $env:PATH = "$out;$env:PATH"
          & "$env:RUNNER_TEMP\hpd-native-abi-smoke.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: hpd-${{ matrix.domain }}-native-abi-${{ matrix.rid }}
          path: ${{ runner.temp }}/hpd-native-abi
